<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://world.openfoodfacts.org https://cdn.jsdelivr.net; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Plates</title>

  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#171512">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plates">

  <!-- No web font by design: a CDN font is a render-blocking round trip on
       every cold start, and this app is opened dozens of times a day. -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.107.0/dist/umd/supabase.js" integrity="sha384-CQbEv3UOeYwlaBLdPF5KqEagCP39Q1KpvJC6Gwa3UGjZAwMvpA+0TFxSSnrgb4MX" crossorigin="anonymous"></script>
</head>
<body>

<!-- Bare x-data roots the Alpine component tree. Without it Alpine never walks
     these templates and the page renders empty. -->
<div class="app" x-data>

  <!-- Booting ------------------------------------------------------------- -->
  <template x-if="!$store.auth.ready">
    <div class="screen-centered">
      <div class="spinner" role="status" aria-label="Loading"></div>
    </div>
  </template>

  <!-- Signed out ---------------------------------------------------------- -->
  <template x-if="$store.auth.ready && !$store.auth.session">
    <div class="screen-centered">
      <div class="mark">Plates</div>
      <p>Food and training, for the two of us.</p>
      <button class="btn btn-primary" @click="$store.auth.signIn()">Sign in with Google</button>
      <p class="sync-line" x-show="$store.auth.error" x-text="$store.auth.error"></p>
    </div>
  </template>

  <!-- Signed in, not a member --------------------------------------------- -->
  <template x-if="$store.auth.ready && $store.auth.session && !$store.auth.isMember">
    <div class="screen-centered">
      <div class="mark">Plates</div>
      <p>
        Signed in as <span x-text="$store.auth.email"></span>, but this account
        isn't on the list.
      </p>
      <p class="notice notice-error" x-show="$store.auth.error" x-text="$store.auth.error"></p>
      <button class="btn btn-ghost" @click="$store.auth.signOut()">Sign out</button>
    </div>
  </template>

  <!-- The app ------------------------------------------------------------- -->
  <template x-if="$store.auth.ready && $store.auth.isMember">
    <div style="display: contents;">

      <header class="app-bar">
        <h1>Plates</h1>
        <span class="app-bar-meta" x-text="$store.auth.displayName"></span>
      </header>

      <!-- Today ------------------------------------------------------------ -->
      <main class="app-main" x-data="todayPage" x-show="$store.ui.view === 'today'">

        <div class="datenav">
          <button class="tap" @click="$store.ui.shiftDay(-1)" aria-label="Previous day">‹</button>
          <button class="datenav-label" @click="$store.ui.goToday()">
            <b x-text="$store.ui.dayLabel"></b>
            <small x-show="!$store.ui.isToday">
              <span x-text="$store.ui.viewDate"></span> · tap for today
            </small>
          </button>
          <button class="tap" @click="$store.ui.shiftDay(1)" aria-label="Next day">›</button>
        </div>

        <!-- A future day with entries is a plan, not a record. Say so, so the
             numbers aren't mistaken for something already eaten. -->
        <div class="sync-line" x-show="$store.ui.isFuture && entries.length">
          <span class="dot dot-pending"></span> Planned
        </div>

        <div class="card readout">
          <div class="readout-head">
            <div>
              <div class="readout-total" x-text="round(totals.calories).toLocaleString()"></div>
              <div class="readout-of">
                <span x-show="calorieTarget">of <span x-text="calorieTarget?.toLocaleString()"></span> kcal</span>
                <span x-show="!calorieTarget">kcal · no target set</span>
              </div>
            </div>
            <div class="readout-remaining" :class="remaining !== null && remaining < 0 && 'is-over'" x-show="calorieTarget">
              <b x-text="Math.abs(remaining ?? 0).toLocaleString()"></b>
              <small x-text="(remaining ?? 0) < 0 ? 'over' : 'left'"></small>
            </div>
          </div>

          <p class="infood" x-show="remainingInFood">
            ≈ <span x-text="remainingInFood"></span>
          </p>

          <!-- The calorie readout as a loaded barbell. Width is each macro's
               share of the target; heights are equal, because a taller plate
               would read as a heavier one. -->
          <div class="rack" x-show="calorieTarget">
            <template x-for="p in plates" :key="p.key">
              <i :style="`background: ${p.colour}; width: ${p.width}%`"></i>
            </template>
            <i class="collar" x-show="plates.length"></i>
          </div>

          <div class="macros">
            <template x-for="m in [
              { key: 'protein_g', name: 'Protein', color: 'var(--color-protein)' },
              { key: 'carbs_g',   name: 'Carbs',   color: 'var(--color-carbs)' },
              { key: 'fat_g',     name: 'Fat',     color: 'var(--color-fat)' }
            ]" :key="m.key">
              <div class="macro">
                <span class="dot" :style="`background: ${m.color}`"></span>
                <span class="macro-name" x-text="m.name"></span>
                <span class="macro-bar"><i :style="`background: ${m.color}; width: ${percent(m.key)}%`"></i></span>
                <span class="macro-val">
                  <span x-text="round(totals[m.key])"></span><s x-show="target(m.key)">/<span x-text="target(m.key)"></span></s>
                </span>
              </div>
            </template>
          </div>
        </div>

        <template x-if="!entries.length">
          <p class="empty">Nothing logged yet today.</p>
        </template>

        <template x-for="meal in meals" :key="meal.slot">
          <div>
            <div class="section-head">
              <span x-text="mealLabel(meal.slot)"></span>
              <span x-text="round(meal.totals.calories)"></span>
            </div>
            <div class="rows">
              <template x-for="entry in meal.entries" :key="entry.id">
                <div class="row">
                  <div class="row-text">
                    <b x-text="entry.description"></b>
                    <small><span x-text="entry.quantity"></span><span x-text="entry.unit"></span></small>
                  </div>
                  <span class="row-num" x-text="round(entry.calories)"></span>
                  <button class="tap" @click="removeEntry(entry.id)" :aria-label="`Remove ${entry.description}`">×</button>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- Meal prep --------------------------------------------------------- -->
        <div class="section-head" style="margin-top: var(--space-4);"><span>Meal prep</span></div>
        <div class="chips">
          <button class="chip" x-show="entries.length" @click="openPrep('copy')">Copy day forward</button>
          <button class="chip" x-show="entries.length" @click="openPrep('save')">Save as template</button>
          <button class="chip" x-show="templates.length" @click="openPrep('apply')">Apply template</button>
        </div>

        <template x-if="prep === 'copy'">
          <div class="sheet-backdrop" @click.self="closePrep()">
            <div class="sheet">
              <div class="grabber"></div>
              <div class="card-label">Copy this day forward</div>
              <p style="font-size: var(--text-sm); color: var(--color-text-muted)">
                Copies all <span x-text="entries.length"></span> entries from
                <span x-text="$store.ui.dayLabel.toLowerCase()"></span> onto the days that follow.
              </p>
              <div class="qty">
                <button class="qty-step" @click="copyCount = Math.max(1, copyCount - 1)" aria-label="Fewer days">−</button>
                <label class="qty-amount">
                  <input type="number" inputmode="numeric" min="1" max="14" x-model.number="copyCount">
                  <small>days</small>
                </label>
                <button class="qty-step" @click="copyCount = Math.min(14, copyCount + 1)" aria-label="More days">+</button>
              </div>
              <button class="btn btn-primary btn-block" @click="copyForward()">Copy</button>
              <button class="btn btn-ghost btn-block" @click="closePrep()">Cancel</button>
            </div>
          </div>
        </template>

        <template x-if="prep === 'save'">
          <div class="sheet-backdrop" @click.self="closePrep()">
            <div class="sheet">
              <div class="grabber"></div>
              <div class="card-label">Save this day as a template</div>
              <div class="field">
                <label for="t-name">Name</label>
                <input id="t-name" type="text" x-model="templateName" placeholder="Cut day A" autocomplete="off">
              </div>
              <button class="btn btn-primary btn-block" :disabled="!templateName.trim()" @click="saveAsTemplate()">
                Save <span x-text="entries.length"></span> entries
              </button>
              <button class="btn btn-ghost btn-block" @click="closePrep()">Cancel</button>
            </div>
          </div>
        </template>

        <template x-if="prep === 'apply'">
          <div class="sheet-backdrop" @click.self="closePrep()">
            <div class="sheet">
              <div class="grabber"></div>
              <div class="card-label">Add a template to <span x-text="$store.ui.dayLabel.toLowerCase()"></span></div>
              <div class="rows">
                <template x-for="t in templates" :key="t.id">
                  <div class="row">
                    <button class="row-text" @click="applyTemplate(t)">
                      <b x-text="t.name"></b>
                      <small x-text="`${(t.items || []).length} entries`"></small>
                    </button>
                    <button class="tap" @click="removeTemplate(t)" :aria-label="`Delete ${t.name}`">×</button>
                  </div>
                </template>
              </div>
              <button class="btn btn-ghost btn-block" @click="closePrep()">Cancel</button>
            </div>
          </div>
        </template>
      </main>

      <!-- Log -------------------------------------------------------------- -->
      <main class="app-main log-panel" x-data="logPage" x-show="$store.ui.logOpen" x-cloak>

        <div class="app-bar" style="padding-left: 0; padding-right: 0;">
          <h1>Add food</h1>
          <button class="chip" @click="$store.ui.closeLog()">
            <span x-text="$store.ui.dayLabel"></span> · Done
          </button>
        </div>

        <div class="search-row">
          <div class="search">
            <span aria-hidden="true">⌕</span>
            <input type="search" placeholder="Search your foods…" x-model="term"
                   enterkeyhint="search" autocomplete="off">
          </div>
          <button class="tap tap-primary" x-show="canScan" @click="openScanner()"
                  aria-label="Scan a barcode">
            <svg class="icon" style="width:19px;height:19px" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
              <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.2l1.3-2h7.9l1.3 2h2.3A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-9Z"/>
              <circle cx="12" cy="13" r="3.4"/>
            </svg>
          </button>
        </div>

        <div class="chips">
          <button class="chip" :class="filter === 'frequent' && 'is-active'" @click="filter = 'frequent'">Frequent</button>
          <button class="chip" :class="filter === 'recent'   && 'is-active'" @click="filter = 'recent'">Recent</button>
          <button class="chip" :class="filter === 'mine'     && 'is-active'" @click="filter = 'mine'">My foods</button>
        </div>

        <div class="section-head">
          <span x-text="mealSlot"></span>
          <span x-text="`${results.length} shown`"></span>
        </div>

        <div class="rows">
          <template x-for="item in results" :key="item.id">
            <div class="row">
              <button class="row-text" @click="openSheet(item)">
                <b x-text="item.name"></b>
                <small>
                  <span x-text="item.lastQuantity ?? item.serving_qty"></span><span x-text="item.serving_unit"></span>
                  <span x-show="item.calories !== null"> · <span x-text="Math.round(item.calories)"></span> kcal</span>
                </small>
              </button>
              <span class="freq" x-show="item.count" x-text="`${item.count}×`"></span>
              <!-- Only appears once there's something to take back. -->
              <button class="tap" x-show="loggedToday(item)" @click="undoLast(item)"
                      :aria-label="`Remove last ${item.name}`">−</button>
              <button class="tap tap-primary" @click="quickLog(item)" :aria-label="`Log ${item.name}`">+</button>
            </div>
          </template>
        </div>

        <template x-if="!results.length">
          <p class="empty">
            <span x-show="term">No match for “<span x-text="term"></span>”.</span>
            <span x-show="!term">No foods yet — add the first one.</span>
          </p>
        </template>

        <button class="btn btn-block" x-show="term" @click="searchOnline()">
          <span x-show="looksLikeBarcode">Look up barcode <span x-text="term"></span></span>
          <span x-show="!looksLikeBarcode">Search online for “<span x-text="term"></span>”</span>
        </button>

        <button class="btn btn-block" @click="startCreate()">
          <span x-show="term">Add “<span x-text="term"></span>” by hand</span>
          <span x-show="!term">Add a food</span>
        </button>

        <template x-if="combos.length">
          <div>
            <div class="section-head"><span>Saved combos</span></div>
            <div class="rows">
              <template x-for="combo in combos" :key="combo.id">
                <div class="row">
                  <div class="row-text">
                    <b x-text="combo.name"></b>
                    <small x-text="`${(combo.items || []).length} items`"></small>
                  </div>
                  <button class="tap tap-primary" @click="logCombo(combo)" :aria-label="`Log ${combo.name}`">+</button>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- Scanner --------------------------------------------------------- -->
        <template x-if="scan">
          <div class="sheet-backdrop" @click.self="closeScanner()">
            <div class="sheet">
              <div class="grabber"></div>
              <div class="card-label">Scan a barcode</div>

              <div class="viewfinder">
                <video x-ref="video" playsinline muted autoplay></video>
                <div class="reticle" aria-hidden="true"></div>
              </div>

              <p class="prefill" x-show="scan.message" x-text="scan.message"></p>

              <div class="sync-line" x-show="scan.status === 'starting'">
                <span class="spinner" style="width:14px;height:14px"></span> Starting camera…
              </div>

              <button class="btn btn-primary btn-block"
                      :disabled="scan.status !== 'ready'"
                      @click="captureBarcode()">
                <span x-show="scan.status === 'reading'">Reading…</span>
                <span x-show="scan.status !== 'reading'">Capture</span>
              </button>

              <button class="btn btn-ghost btn-block" @click="closeScanner(); startCreate()">
                Add by hand instead
              </button>
              <button class="btn btn-ghost btn-block" @click="closeScanner()">Cancel</button>
            </div>
          </div>
        </template>

        <!-- Online lookup results ------------------------------------------ -->
        <template x-if="lookup">
          <div class="sheet-backdrop" @click.self="closeLookup()">
            <div class="sheet">
              <div class="grabber"></div>
              <div class="card-label">
                <span x-show="looksLikeBarcode">Open Food Facts</span>
                <span x-show="!looksLikeBarcode">USDA FoodData Central</span>
              </div>

              <div class="sync-line" x-show="lookup.status === 'searching'">
                <span class="spinner" style="width:14px;height:14px"></span> Searching…
              </div>

              <div class="notice notice-error" x-show="lookup.error" x-text="lookup.error"></div>

              <div class="rows" x-show="lookup.results.length">
                <template x-for="(r, i) in lookup.results" :key="i">
                  <button class="row" @click="acceptLookup(r)">
                    <div class="row-text">
                      <b x-text="r.draft.name"></b>
                      <small>
                        <span x-text="r.draft.brand || r.source"></span>
                        · <span x-text="Math.round(r.draft.calories ?? 0)"></span> kcal/100<span x-text="r.draft.serving_unit"></span>
                      </small>
                    </div>
                    <!-- Incomplete data is called out rather than hidden: OFF and
                         USDA both return partial entries, and a silent null would
                         become a silent zero in your day. -->
                    <span class="pill" x-show="r.missing.length"
                          :title="r.missing.join(', ')"
                          x-text="`${r.missing.length} missing`"></span>
                    <span class="tap">›</span>
                  </button>
                </template>
              </div>

              <p class="empty" x-show="lookup.status === 'done' && !lookup.results.length && !lookup.error">
                Nothing found.
              </p>

              <button class="btn btn-ghost btn-block" @click="closeLookup(); startCreate()">
                Add by hand instead
              </button>
              <button class="btn btn-ghost btn-block" @click="closeLookup()">Cancel</button>
            </div>
          </div>
        </template>

        <!-- Quantity sheet ------------------------------------------------- -->
        <template x-if="sheet">
          <div class="sheet-backdrop" @click.self="closeSheet()">
            <div class="sheet">
              <div class="grabber"></div>

              <div>
                <div style="font-weight: 600;" x-text="sheet.food.name"></div>
                <div class="card-label" x-text="sheet.food.brand || sheet.food.source || 'my foods'"></div>
              </div>

              <div class="qty">
                <button class="qty-step" @click="step(-10)" aria-label="Decrease">−</button>
                <label class="qty-amount">
                  <input type="number" inputmode="decimal" step="any" min="0" x-model.number="sheet.quantity">
                  <small x-text="sheet.unit"></small>
                </label>
                <button class="qty-step" @click="step(10)" aria-label="Increase">+</button>
              </div>

              <p class="prefill" x-show="sheet.prefilled">↺ Your usual amount</p>

              <div class="macros">
                <template x-for="m in [
                  { key: 'protein_g', name: 'Protein', color: 'var(--color-protein)' },
                  { key: 'carbs_g',   name: 'Carbs',   color: 'var(--color-carbs)' },
                  { key: 'fat_g',     name: 'Fat',     color: 'var(--color-fat)' }
                ]" :key="m.key">
                  <div class="macro">
                    <span class="dot" :style="`background: ${m.color}`"></span>
                    <span class="macro-name" x-text="m.name"></span>
                    <span class="macro-val" style="margin-left: auto;"
                          x-text="sheetMacros[m.key] ?? '—'"></span>
                  </div>
                </template>
              </div>

              <button class="btn btn-primary btn-block" @click="confirmSheet()">
                Log <span x-text="Math.round(sheetMacros.calories ?? 0)"></span> kcal
              </button>
              <button class="btn btn-ghost btn-block" @click="closeSheet()">Cancel</button>
            </div>
          </div>
        </template>

        <!-- New food ------------------------------------------------------- -->
        <template x-if="creating">
          <div class="sheet-backdrop" @click.self="cancelCreate()">
            <div class="sheet">
              <div class="grabber"></div>
              <div class="card-label">New food · per serving</div>

              <div class="field">
                <label for="f-name">Name</label>
                <input id="f-name" type="text" x-model="draft.name" autocomplete="off">
              </div>

              <div class="field">
                <label for="f-brand">Brand</label>
                <input id="f-brand" type="text" x-model="draft.brand" autocomplete="off">
              </div>

              <div class="field-grid">
                <div class="field">
                  <label for="f-qty">Serving</label>
                  <input id="f-qty" type="number" inputmode="decimal" step="any" x-model.number="draft.serving_qty">
                </div>
                <div class="field">
                  <label for="f-unit">Unit</label>
                  <input id="f-unit" type="text" x-model="draft.serving_unit">
                </div>
              </div>

              <div class="field-grid">
                <div class="field">
                  <label for="f-kcal">Calories</label>
                  <input id="f-kcal" type="number" inputmode="decimal" step="any" x-model="draft.calories">
                </div>
                <div class="field">
                  <label for="f-protein">Protein g</label>
                  <input id="f-protein" type="number" inputmode="decimal" step="any" x-model="draft.protein_g">
                </div>
                <div class="field">
                  <label for="f-carbs">Carbs g</label>
                  <input id="f-carbs" type="number" inputmode="decimal" step="any" x-model="draft.carbs_g">
                </div>
                <div class="field">
                  <label for="f-fat">Fat g</label>
                  <input id="f-fat" type="number" inputmode="decimal" step="any" x-model="draft.fat_g">
                </div>
                <div class="field">
                  <label for="f-fiber">Fiber g</label>
                  <input id="f-fiber" type="number" inputmode="decimal" step="any" x-model="draft.fiber_g">
                </div>
                <div class="field">
                  <label for="f-sodium">Sodium mg</label>
                  <input id="f-sodium" type="number" inputmode="decimal" step="any" x-model="draft.sodium_mg">
                </div>
              </div>

              <button class="btn btn-primary btn-block" :disabled="!canSaveDraft" @click="saveDraft()">
                Save food
              </button>
              <button class="btn btn-ghost btn-block" @click="cancelCreate()">Cancel</button>
            </div>
          </div>
        </template>
      </main>

      <!-- Train / Stats ---------------------------------------------------- -->
      <main class="app-main" x-data="trainPage" x-show="$store.ui.view === 'train'">

        <!-- No workout running ---------------------------------------------- -->
        <template x-if="!session">
          <div style="display: contents;">
            <button class="btn btn-primary btn-block" @click="startEmpty()">Start workout</button>

            <div>
              <div class="section-head">
                <span>Routines</span>
                <button class="chip" @click="newRoutine()">New</button>
              </div>
              <div class="rows" x-show="routines.length">
                <template x-for="r in routines" :key="r.id">
                  <button class="row" @click="openRoutine(r)">
                    <div class="row-text">
                      <b x-text="r.name"></b>
                      <small x-text="`${routineCount(r)} exercises`"></small>
                    </div>
                    <span class="tap">›</span>
                  </button>
                </template>
              </div>
            </div>

            <div class="section-head">
              <span>Import</span>
            </div>
            <label class="btn btn-block" style="cursor:pointer">
              Import from Hevy (CSV)
              <input type="file" accept=".csv,text/csv" @change="importFile($event)" hidden>
            </label>
            <div class="sync-line" x-show="hevy && hevy.phase !== 'done' && hevy.phase !== 'error'">
              <span class="spinner" style="width:14px;height:14px"></span>
              <span x-text="hevyLabel"></span>
            </div>
            <div class="notice" x-show="hevy && hevy.phase === 'done'" x-text="hevyLabel"></div>
            <div class="notice notice-error" x-show="hevy && hevy.phase === 'error'"
                 x-text="hevy && hevy.message"></div>

            <div class="section-head" x-show="imagesMissing">
              <span>Exercise images</span>
              <button class="chip" @click="loadImages()" x-show="!imageImport">
                Load <span x-text="imagesMissing"></span>
              </button>
            </div>
            <div class="sync-line" x-show="imageImport && imageImport.status !== 'done'">
              <span class="spinner" style="width:14px;height:14px"></span>
              <span x-text="imageLabel"></span>
            </div>
            <div class="notice notice-error" x-show="imageImport && imageImport.status === 'error'"
                 x-text="imageLabel"></div>

            <template x-if="history.length">
              <div>
                <div class="section-head"><span>Recent</span></div>
                <div class="rows">
                  <template x-for="s in history" :key="s.id">
                    <div class="row">
                      <div class="row-text">
                        <b x-text="s.name || 'Workout'"></b>
                        <small x-text="`${sessionDate(s)} · ${sessionSummary(s)}`"></small>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <p class="empty" x-show="!routines.length && !history.length">
              Start a workout and add exercises as you go. Save it as a routine at the end.
            </p>
          </div>
        </template>

        <!-- Workout in progress --------------------------------------------- -->
        <template x-if="session">
          <div style="display: contents;">

            <div class="timer">
              <div>
                <div class="t" x-text="elapsed"></div>
                <small>Elapsed</small>
              </div>
              <div class="rest" x-show="restEndsAt">
                <b x-text="restClock"></b>
                <small>Rest</small>
              </div>
              <div class="rest" x-show="!restEndsAt">
                <b class="num" x-text="volume.toLocaleString()"></b>
                <small>lb volume</small>
              </div>
            </div>

            <div class="chips" x-show="restEndsAt">
              <button class="chip" @click="addRest(30)">+30s</button>
              <button class="chip" @click="addRest(-30)">−30s</button>
              <button class="chip" @click="endRest()">Skip rest</button>
            </div>

            <template x-for="group in groups" :key="group.key">
              <div class="card">
                <div class="readout-head">
                  <div style="display:flex; align-items:center; gap:var(--space-3); min-width:0;">
                    <img class="thumb" x-show="imageFor(exerciseById(group.exerciseId))"
                         :src="imageFor(exerciseById(group.exerciseId))" alt=""
                         loading="lazy" decoding="async">
                    <button style="min-width:0; text-align:left"
                            @click="openExercise(group.exerciseId, group.name)">
                      <b x-text="group.name"></b>
                      <div class="prev" x-show="previous(group)">
                        Last: <span x-text="previous(group)"></span> · tap for history
                      </div>
                    </button>
                  </div>
                </div>

                <div class="setgrid">
                  <div class="sethead">
                    <span>#</span><span>lb</span><span>Reps</span><span></span><span></span>
                  </div>
                  <template x-for="(set, i) in group.sets" :key="set.id">
                    <div class="setrow" :class="[set.completed_at && 'done', isRecord(set, group) && 'record']">
                      <span class="idx" :class="set.is_warmup && 'warm'" x-text="set.is_warmup ? 'W' : i + 1"></span>
                      <input class="cell num" type="number" inputmode="decimal" step="any"
                             :value="set.weight_lb" @change="edit(set, 'weight_lb', $event.target.value)"
                             aria-label="Weight in pounds">
                      <input class="cell num" type="number" inputmode="numeric"
                             :value="set.reps" @change="edit(set, 'reps', $event.target.value)"
                             aria-label="Reps">
                      <button class="check" @click="toggleDone(set)"
                              :aria-label="set.completed_at ? 'Mark set incomplete' : 'Mark set done'"
                              x-text="set.completed_at ? '✓' : '○'"></button>
                      <button class="tap" @click="dropSet(set)" aria-label="Remove set">×</button>
                    </div>
                  </template>
                </div>

                <template x-for="set in group.sets.filter(s => !s.completed_at && loadout(group, s))"
                          :key="`load-${set.id}`">
                  <div class="loadout">
                    <span class="lbl">Per side</span>
                    <template x-for="(size, i) in loadout(group, set).plates" :key="i">
                      <b :style="`background: ${plateColour(size)}`" x-text="size"></b>
                    </template>
                  </div>
                </template>

                <button class="btn btn-ghost btn-block" @click="addSetTo(group)">Add set</button>
              </div>
            </template>

            <button class="btn btn-block" @click="picker = true">Add exercise</button>
            <button class="btn btn-primary btn-block" @click="finishing = true">Finish workout</button>
          </div>
        </template>

        <!-- Exercise picker -------------------------------------------------- -->
        <template x-if="picker">
          <div class="sheet-backdrop" @click.self="picker = false">
            <div class="sheet">
              <div class="grabber"></div>
              <div class="search">
                <span aria-hidden="true">⌕</span>
                <input type="search" placeholder="Search exercises…" x-model="pickerTerm" autocomplete="off">
              </div>
              <div class="rows">
                <template x-for="e in library.slice(0, 40)" :key="e.id">
                  <button class="row" @click="builder ? addToRoutine(e) : addExercise(e)">
                    <!-- loading="lazy": nothing downloads until it scrolls in -->
                    <img class="thumb" x-show="imageFor(e)" :src="imageFor(e)" alt=""
                         loading="lazy" decoding="async">
                    <div class="row-text">
                      <b x-text="e.name"></b>
                      <small x-text="[e.primary_muscle, e.equipment].filter(Boolean).join(' · ')"></small>
                    </div>
                    <span class="tap">›</span>
                  </button>
                </template>
              </div>
              <button class="btn btn-ghost btn-block" @click="picker = false">Cancel</button>
            </div>
          </div>
        </template>

        <!-- Exercise history -------------------------------------------------- -->
        <template x-if="detail">
          <div class="sheet-backdrop" @click.self="closeExercise()">
            <div class="sheet">
              <div class="grabber"></div>
              <div style="font-size:var(--text-lg); font-weight:600" x-text="detail.name"></div>

              <div class="shots" x-show="(detail.exercise.image_urls || []).length">
                <template x-for="src in (detail.exercise.image_urls || [])" :key="src">
                  <img :src="src" alt="" loading="lazy" decoding="async">
                </template>
              </div>

              <div class="chips">
                <span class="chip" x-show="detailBests.heaviest">
                  Best <span x-text="detailBests.heaviest && detailBests.heaviest.weight_lb"></span> lb ×
                  <span x-text="detailBests.heaviest && detailBests.heaviest.reps"></span>
                </span>
                <span class="chip" x-show="detailBests.bestRm">
                  Est. 1RM <span x-text="detailBests.bestRm"></span> lb
                </span>
                <span class="chip"><span x-text="detailHistory.length"></span> sessions</span>
              </div>

              <div class="rows">
                <template x-for="entry in detailHistory" :key="entry.session.id">
                  <div class="row">
                    <div class="row-text">
                      <b x-text="detailDate(entry)"></b>
                      <small x-text="setLine(entry)"></small>
                    </div>
                    <span class="row-num" x-text="`${Math.round(entry.volume).toLocaleString()} lb`"></span>
                  </div>
                </template>
              </div>

              <p class="empty" x-show="!detailHistory.length">No history for this exercise yet.</p>
              <button class="btn btn-ghost btn-block" @click="closeExercise()">Close</button>
            </div>
          </div>
        </template>

        <!-- Routine builder --------------------------------------------------- -->
        <template x-if="builder">
          <div class="sheet-backdrop" @click.self="closeBuilder()">
            <div class="sheet">
              <div class="grabber"></div>
              <!-- View ------------------------------------------------------ -->
              <template x-if="builder.mode === 'view'">
                <div>
                  <div style="font-size:var(--text-lg); font-weight:600" x-text="builder.name"></div>

                  <div class="rows">
                    <template x-for="row in builderExercises" :key="row.item.id">
                      <button class="row" @click="openExercise(row.item.exercise_id, row.name)">
                        <img class="thumb" x-show="imageFor(row.exercise)" :src="imageFor(row.exercise)"
                             alt="" loading="lazy" decoding="async">
                        <div class="row-text">
                          <b x-text="row.name"></b>
                          <small x-text="lastLine(row)"></small>
                        </div>
                        <span class="tap">›</span>
                      </button>
                    </template>
                  </div>

                  <p class="empty" x-show="!builderExercises.length">No exercises in this routine.</p>

                  <button class="btn btn-primary btn-block" @click="startFromBuilder()">Start workout</button>
                  <button class="btn btn-block" @click="toEdit()">Edit</button>
                  <button class="btn btn-ghost btn-block" @click="closeBuilder()">Close</button>
                  <button class="btn btn-ghost btn-block" @click="deleteFromBuilder()">Delete routine</button>
                </div>
              </template>

              <!-- Edit ------------------------------------------------------ -->
              <template x-if="builder.mode === 'edit'">
                <div>
              <div class="card-label" x-text="builder.routine ? 'Edit routine' : 'New routine'"></div>

              <div class="field">
                <label for="rt-name">Name</label>
                <input id="rt-name" type="text" x-model="builder.name" placeholder="Push A"
                       autocomplete="off" @change="saveRoutineName()">
              </div>

              <template x-if="builder.routine">
                <div>
                  <div class="rows">
                    <template x-for="row in builderExercises" :key="row.item.id">
                      <div class="row">
                        <img class="thumb" x-show="imageFor(row.exercise)" :src="imageFor(row.exercise)"
                             alt="" loading="lazy" decoding="async">
                        <div class="row-text"><b x-text="row.name"></b></div>
                        <button class="tap" @click="dropRoutineItem(row.item)"
                                :aria-label="`Remove ${row.name}`">×</button>
                      </div>
                    </template>
                  </div>

                  <p class="empty" x-show="!builderExercises.length">No exercises yet.</p>
                  <button class="btn btn-block" @click="picker = true">Add exercise</button>
                </div>
              </template>

              <p class="empty" x-show="!builder.routine">Name it first, then add exercises.</p>
              <button class="btn btn-primary btn-block" @click="saveRoutineName(); closeBuilder()">Done</button>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- Finish ----------------------------------------------------------- -->
        <template x-if="finishing">
          <div class="sheet-backdrop" @click.self="finishing = false">
            <div class="sheet">
              <div class="grabber"></div>
              <div class="card-label">Finish workout</div>
              <p style="font-size: var(--text-sm); color: var(--color-text-muted)">
                <span x-text="groups.length"></span> exercises ·
                <span x-text="volume.toLocaleString()"></span> lb ·
                <span x-text="elapsed"></span>
              </p>
              <div class="field">
                <label for="r-name">Save as routine (optional)</label>
                <input id="r-name" type="text" x-model="routineName" placeholder="Push A" autocomplete="off">
              </div>
              <button class="btn btn-primary btn-block" @click="finishSession()">Finish</button>
              <button class="btn btn-ghost btn-block" @click="discard()">Discard workout</button>
              <button class="btn btn-ghost btn-block" @click="finishing = false">Cancel</button>
            </div>
          </div>
        </template>
      </main>

      <main class="app-main" x-show="$store.ui.view === 'stats'">
        <p class="empty">Trends arrive once there's data to trend.</p>
      </main>

      <!-- Status + nav ----------------------------------------------------- -->
      <div class="app-main" style="flex: none; padding-bottom: var(--space-3);">
        <div class="sync-line">
          <span :class="$store.sync.dotClass"></span>
          <span x-text="$store.sync.label"></span>
        </div>
        <div class="notice notice-error" x-show="$store.sync.error" x-text="$store.sync.error"></div>
      </div>

      <!-- The way food gets added. Log is a panel over this screen, not a
           destination you navigate to and come back from. -->
      <div class="fab-stack" x-show="$store.ui.view === 'today' && !$store.ui.logOpen">
        <button class="fab fab-secondary" x-show="$store.ui.canScan"
                @click="$store.ui.startScan()" aria-label="Scan a barcode">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.2l1.3-2h7.9l1.3 2h2.3A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-9Z"/>
            <circle cx="12" cy="13" r="3.4"/>
          </svg>
        </button>
        <button class="fab" @click="$store.ui.openLog()" aria-label="Add food">+</button>
      </div>

      <nav class="tabbar">
        <button :class="$store.ui.view === 'today' && 'is-active'" @click="$store.ui.go('today')">Today</button>
        <button :class="$store.ui.view === 'train' && 'is-active'" @click="$store.ui.go('train')">Train</button>
        <button :class="$store.ui.view === 'stats' && 'is-active'" @click="$store.ui.go('stats')">Stats</button>
      </nav>

      <div class="toast" x-show="$store.ui.toast" x-transition x-cloak x-text="$store.ui.toast"></div>

    </div>
  </template>

</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
