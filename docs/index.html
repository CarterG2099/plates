<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://world.openfoodfacts.org; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Plates</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
  <meta name="theme-color" content="#171512">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plates">

  <!-- No web font by design: a CDN font is a render-blocking round trip on
       every cold start, and this app is opened dozens of times a day. -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.107.0/dist/umd/supabase.js" integrity="sha384-CQbEv3UOeYwlaBLdPF5KqEagCP39Q1KpvJC6Gwa3UGjZAwMvpA+0TFxSSnrgb4MX" crossorigin="anonymous"></script>
</head>
<body>

<!-- Bare x-data roots the Alpine component tree. Without it Alpine never walks
     these templates and the page renders empty. -->
<div class="app" x-data>

  <!-- Booting ------------------------------------------------------------- -->
  <template x-if="!$store.auth.ready">
    <div class="screen-centered">
      <div class="spinner" role="status" aria-label="Loading"></div>
    </div>
  </template>

  <!-- Signed out ---------------------------------------------------------- -->
  <template x-if="$store.auth.ready && !$store.auth.session">
    <div class="screen-centered">
      <div class="mark">Plates</div>
      <p>Food and training, for the two of us.</p>
      <button class="btn btn-primary" @click="$store.auth.signIn()">Sign in with Google</button>
      <p class="sync-line" x-show="$store.auth.error" x-text="$store.auth.error"></p>
    </div>
  </template>

  <!-- Signed in, not a member --------------------------------------------- -->
  <template x-if="$store.auth.ready && $store.auth.session && !$store.auth.isMember">
    <div class="screen-centered">
      <div class="mark">Plates</div>
      <p>
        Signed in as <span x-text="$store.auth.email"></span>, but this account
        isn't on the list.
      </p>
      <p class="notice notice-error" x-show="$store.auth.error" x-text="$store.auth.error"></p>
      <button class="btn btn-ghost" @click="$store.auth.signOut()">Sign out</button>
    </div>
  </template>

  <!-- The app ------------------------------------------------------------- -->
  <template x-if="$store.auth.ready && $store.auth.isMember">
    <div style="display: contents;">

      <header class="app-bar">
        <h1>Plates</h1>
        <span class="app-bar-meta" x-text="$store.auth.displayName"></span>
      </header>

      <!-- Today ------------------------------------------------------------ -->
      <main class="app-main" x-data="todayPage" x-show="$store.ui.view === 'today'">

        <div class="card readout">
          <div class="readout-head">
            <div>
              <div class="readout-total" x-text="round(totals.calories).toLocaleString()"></div>
              <div class="readout-of">
                <span x-show="calorieTarget">of <span x-text="calorieTarget?.toLocaleString()"></span> kcal</span>
                <span x-show="!calorieTarget">kcal · no target set</span>
              </div>
            </div>
            <div class="readout-remaining" :class="remaining !== null && remaining < 0 && 'is-over'" x-show="calorieTarget">
              <b x-text="Math.abs(remaining ?? 0).toLocaleString()"></b>
              <small x-text="(remaining ?? 0) < 0 ? 'over' : 'left'"></small>
            </div>
          </div>

          <div class="track" x-show="calorieTarget">
            <i :style="`background: var(--color-protein); width: ${segment('protein_g')}%`"></i>
            <i :style="`background: var(--color-carbs);   width: ${segment('carbs_g')}%`"></i>
            <i :style="`background: var(--color-fat);     width: ${segment('fat_g')}%`"></i>
          </div>

          <div class="macros">
            <template x-for="m in [
              { key: 'protein_g', name: 'Protein', color: 'var(--color-protein)' },
              { key: 'carbs_g',   name: 'Carbs',   color: 'var(--color-carbs)' },
              { key: 'fat_g',     name: 'Fat',     color: 'var(--color-fat)' }
            ]" :key="m.key">
              <div class="macro">
                <span class="dot" :style="`background: ${m.color}`"></span>
                <span class="macro-name" x-text="m.name"></span>
                <span class="macro-bar"><i :style="`background: ${m.color}; width: ${percent(m.key)}%`"></i></span>
                <span class="macro-val">
                  <span x-text="round(totals[m.key])"></span><s x-show="target(m.key)">/<span x-text="target(m.key)"></span></s>
                </span>
              </div>
            </template>
          </div>
        </div>

        <template x-if="!entries.length">
          <p class="empty">Nothing logged yet today.</p>
        </template>

        <template x-for="meal in meals" :key="meal.slot">
          <div>
            <div class="section-head">
              <span x-text="mealLabel(meal.slot)"></span>
              <span x-text="round(meal.totals.calories)"></span>
            </div>
            <div class="rows">
              <template x-for="entry in meal.entries" :key="entry.id">
                <div class="row">
                  <div class="row-text">
                    <b x-text="entry.description"></b>
                    <small><span x-text="entry.quantity"></span><span x-text="entry.unit"></span></small>
                  </div>
                  <span class="row-num" x-text="round(entry.calories)"></span>
                  <button class="tap" @click="removeEntry(entry.id)" :aria-label="`Remove ${entry.description}`">×</button>
                </div>
              </template>
            </div>
          </div>
        </template>
      </main>

      <!-- Log -------------------------------------------------------------- -->
      <main class="app-main" x-data="logPage" x-show="$store.ui.view === 'log'">

        <div class="search-row">
          <div class="search">
            <span aria-hidden="true">⌕</span>
            <input type="search" placeholder="Search your foods…" x-model="term"
                   enterkeyhint="search" autocomplete="off">
          </div>
          <button class="tap tap-primary" x-show="canScan" @click="openScanner()"
                  aria-label="Scan a barcode">▢</button>
        </div>

        <div class="chips">
          <button class="chip" :class="filter === 'frequent' && 'is-active'" @click="filter = 'frequent'">Frequent</button>
          <button class="chip" :class="filter === 'recent'   && 'is-active'" @click="filter = 'recent'">Recent</button>
          <button class="chip" :class="filter === 'mine'     && 'is-active'" @click="filter = 'mine'">My foods</button>
        </div>

        <div class="section-head">
          <span x-text="mealSlot"></span>
          <span x-text="`${results.length} shown`"></span>
        </div>

        <div class="rows">
          <template x-for="item in results" :key="item.id">
            <div class="row">
              <button class="row-text" @click="openSheet(item)">
                <b x-text="item.name"></b>
                <small>
                  <span x-text="item.lastQuantity ?? item.serving_qty"></span><span x-text="item.serving_unit"></span>
                  <span x-show="item.calories !== null"> · <span x-text="Math.round(item.calories)"></span> kcal</span>
                </small>
              </button>
              <span class="freq" x-show="item.count" x-text="`${item.count}×`"></span>
              <!-- Only appears once there's something to take back. -->
              <button class="tap" x-show="loggedToday(item)" @click="undoLast(item)"
                      :aria-label="`Remove last ${item.name}`">−</button>
              <button class="tap tap-primary" @click="quickLog(item)" :aria-label="`Log ${item.name}`">+</button>
            </div>
          </template>
        </div>

        <template x-if="!results.length">
          <p class="empty">
            <span x-show="term">No match for “<span x-text="term"></span>”.</span>
            <span x-show="!term">No foods yet — add the first one.</span>
          </p>
        </template>

        <button class="btn btn-block" x-show="term" @click="searchOnline()">
          <span x-show="looksLikeBarcode">Look up barcode <span x-text="term"></span></span>
          <span x-show="!looksLikeBarcode">Search online for “<span x-text="term"></span>”</span>
        </button>

        <button class="btn btn-block" @click="startCreate()">
          <span x-show="term">Add “<span x-text="term"></span>” by hand</span>
          <span x-show="!term">Add a food</span>
        </button>

        <template x-if="combos.length">
          <div>
            <div class="section-head"><span>Saved combos</span></div>
            <div class="rows">
              <template x-for="combo in combos" :key="combo.id">
                <div class="row">
                  <div class="row-text">
                    <b x-text="combo.name"></b>
                    <small x-text="`${(combo.items || []).length} items`"></small>
                  </div>
                  <button class="tap tap-primary" @click="logCombo(combo)" :aria-label="`Log ${combo.name}`">+</button>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- Scanner --------------------------------------------------------- -->
        <template x-if="scan">
          <div class="sheet-backdrop" @click.self="closeScanner()">
            <div class="sheet">
              <div class="grabber"></div>
              <div class="card-label">Scan a barcode</div>

              <div class="viewfinder">
                <video x-ref="video" playsinline muted autoplay></video>
                <div class="reticle" aria-hidden="true"></div>
              </div>

              <p class="prefill" x-show="scan.message" x-text="scan.message"></p>

              <div class="sync-line" x-show="scan.status === 'starting'">
                <span class="spinner" style="width:14px;height:14px"></span> Starting camera…
              </div>

              <button class="btn btn-primary btn-block"
                      :disabled="scan.status !== 'ready'"
                      @click="captureBarcode()">
                <span x-show="scan.status === 'reading'">Reading…</span>
                <span x-show="scan.status !== 'reading'">Capture</span>
              </button>

              <button class="btn btn-ghost btn-block" @click="closeScanner(); startCreate()">
                Add by hand instead
              </button>
              <button class="btn btn-ghost btn-block" @click="closeScanner()">Cancel</button>
            </div>
          </div>
        </template>

        <!-- Online lookup results ------------------------------------------ -->
        <template x-if="lookup">
          <div class="sheet-backdrop" @click.self="closeLookup()">
            <div class="sheet">
              <div class="grabber"></div>
              <div class="card-label">
                <span x-show="looksLikeBarcode">Open Food Facts</span>
                <span x-show="!looksLikeBarcode">USDA FoodData Central</span>
              </div>

              <div class="sync-line" x-show="lookup.status === 'searching'">
                <span class="spinner" style="width:14px;height:14px"></span> Searching…
              </div>

              <div class="notice notice-error" x-show="lookup.error" x-text="lookup.error"></div>

              <div class="rows" x-show="lookup.results.length">
                <template x-for="(r, i) in lookup.results" :key="i">
                  <button class="row" @click="acceptLookup(r)">
                    <div class="row-text">
                      <b x-text="r.draft.name"></b>
                      <small>
                        <span x-text="r.draft.brand || r.source"></span>
                        · <span x-text="Math.round(r.draft.calories ?? 0)"></span> kcal/100<span x-text="r.draft.serving_unit"></span>
                      </small>
                    </div>
                    <!-- Incomplete data is called out rather than hidden: OFF and
                         USDA both return partial entries, and a silent null would
                         become a silent zero in your day. -->
                    <span class="pill" x-show="r.missing.length"
                          :title="r.missing.join(', ')"
                          x-text="`${r.missing.length} missing`"></span>
                    <span class="tap">›</span>
                  </button>
                </template>
              </div>

              <p class="empty" x-show="lookup.status === 'done' && !lookup.results.length && !lookup.error">
                Nothing found.
              </p>

              <button class="btn btn-ghost btn-block" @click="closeLookup(); startCreate()">
                Add by hand instead
              </button>
              <button class="btn btn-ghost btn-block" @click="closeLookup()">Cancel</button>
            </div>
          </div>
        </template>

        <!-- Quantity sheet ------------------------------------------------- -->
        <template x-if="sheet">
          <div class="sheet-backdrop" @click.self="closeSheet()">
            <div class="sheet">
              <div class="grabber"></div>

              <div>
                <div style="font-weight: 600;" x-text="sheet.food.name"></div>
                <div class="card-label" x-text="sheet.food.brand || sheet.food.source || 'my foods'"></div>
              </div>

              <div class="qty">
                <button class="qty-step" @click="step(-10)" aria-label="Decrease">−</button>
                <label class="qty-amount">
                  <input type="number" inputmode="decimal" step="any" min="0" x-model.number="sheet.quantity">
                  <small x-text="sheet.unit"></small>
                </label>
                <button class="qty-step" @click="step(10)" aria-label="Increase">+</button>
              </div>

              <p class="prefill" x-show="sheet.prefilled">↺ Your usual amount</p>

              <div class="macros">
                <template x-for="m in [
                  { key: 'protein_g', name: 'Protein', color: 'var(--color-protein)' },
                  { key: 'carbs_g',   name: 'Carbs',   color: 'var(--color-carbs)' },
                  { key: 'fat_g',     name: 'Fat',     color: 'var(--color-fat)' }
                ]" :key="m.key">
                  <div class="macro">
                    <span class="dot" :style="`background: ${m.color}`"></span>
                    <span class="macro-name" x-text="m.name"></span>
                    <span class="macro-val" style="margin-left: auto;"
                          x-text="sheetMacros[m.key] ?? '—'"></span>
                  </div>
                </template>
              </div>

              <button class="btn btn-primary btn-block" @click="confirmSheet()">
                Log <span x-text="Math.round(sheetMacros.calories ?? 0)"></span> kcal
              </button>
              <button class="btn btn-ghost btn-block" @click="closeSheet()">Cancel</button>
            </div>
          </div>
        </template>

        <!-- New food ------------------------------------------------------- -->
        <template x-if="creating">
          <div class="sheet-backdrop" @click.self="cancelCreate()">
            <div class="sheet">
              <div class="grabber"></div>
              <div class="card-label">New food · per serving</div>

              <div class="field">
                <label for="f-name">Name</label>
                <input id="f-name" type="text" x-model="draft.name" autocomplete="off">
              </div>

              <div class="field">
                <label for="f-brand">Brand</label>
                <input id="f-brand" type="text" x-model="draft.brand" autocomplete="off">
              </div>

              <div class="field-grid">
                <div class="field">
                  <label for="f-qty">Serving</label>
                  <input id="f-qty" type="number" inputmode="decimal" step="any" x-model.number="draft.serving_qty">
                </div>
                <div class="field">
                  <label for="f-unit">Unit</label>
                  <input id="f-unit" type="text" x-model="draft.serving_unit">
                </div>
              </div>

              <div class="field-grid">
                <div class="field">
                  <label for="f-kcal">Calories</label>
                  <input id="f-kcal" type="number" inputmode="decimal" step="any" x-model="draft.calories">
                </div>
                <div class="field">
                  <label for="f-protein">Protein g</label>
                  <input id="f-protein" type="number" inputmode="decimal" step="any" x-model="draft.protein_g">
                </div>
                <div class="field">
                  <label for="f-carbs">Carbs g</label>
                  <input id="f-carbs" type="number" inputmode="decimal" step="any" x-model="draft.carbs_g">
                </div>
                <div class="field">
                  <label for="f-fat">Fat g</label>
                  <input id="f-fat" type="number" inputmode="decimal" step="any" x-model="draft.fat_g">
                </div>
                <div class="field">
                  <label for="f-fiber">Fiber g</label>
                  <input id="f-fiber" type="number" inputmode="decimal" step="any" x-model="draft.fiber_g">
                </div>
                <div class="field">
                  <label for="f-sodium">Sodium mg</label>
                  <input id="f-sodium" type="number" inputmode="decimal" step="any" x-model="draft.sodium_mg">
                </div>
              </div>

              <button class="btn btn-primary btn-block" :disabled="!canSaveDraft" @click="saveDraft()">
                Save food
              </button>
              <button class="btn btn-ghost btn-block" @click="cancelCreate()">Cancel</button>
            </div>
          </div>
        </template>
      </main>

      <!-- Train / Stats ---------------------------------------------------- -->
      <main class="app-main" x-show="$store.ui.view === 'train'">
        <p class="empty">Workouts come next.</p>
      </main>

      <main class="app-main" x-show="$store.ui.view === 'stats'">
        <p class="empty">Trends arrive once there's data to trend.</p>
      </main>

      <!-- Status + nav ----------------------------------------------------- -->
      <div class="app-main" style="flex: none; padding-bottom: var(--space-3);">
        <div class="sync-line">
          <span :class="$store.sync.dotClass"></span>
          <span x-text="$store.sync.label"></span>
        </div>
        <div class="notice notice-error" x-show="$store.sync.error" x-text="$store.sync.error"></div>
      </div>

      <nav class="tabbar">
        <button :class="$store.ui.view === 'today' && 'is-active'" @click="$store.ui.go('today')">Today</button>
        <button :class="$store.ui.view === 'log'   && 'is-active'" @click="$store.ui.go('log')">Log</button>
        <button :class="$store.ui.view === 'train' && 'is-active'" @click="$store.ui.go('train')">Train</button>
        <button :class="$store.ui.view === 'stats' && 'is-active'" @click="$store.ui.go('stats')">Stats</button>
      </nav>

      <div class="toast" x-show="$store.ui.toast" x-transition x-cloak x-text="$store.ui.toast"></div>

    </div>
  </template>

</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
