                  </button>

                  <ol x-show="open && detailInstructions.length" x-cloak>
                    <template x-for="(step, i) in detailInstructions" :key="i">
                      <li x-text="step"></li>
                    </template>
                  </ol>

                  <p class="empty" style="padding:var(--space-3) 0" x-show="!detailInstructions.length">
                    No instructions for this one yet.
                  </p>
                </div>
              </div>

              <div class="chips">
                <!-- Furthest for a run, heaviest for a lift — detailBestLine
                     picks, so this does not have to know which. -->
                <span class="chip" x-show="detailBestLine">
                  Best <span x-text="detailBestLine"></span>
                </span>
                <span class="chip" x-show="detailShowsOneRm">
                  Est. 1RM <span x-text="detailBests.bestRm"></span> lb
                </span>
                <span class="chip"><span x-text="detailHistory.length"></span> sessions</span>
              </div>

              <div class="rows">
                <template x-for="entry in detailHistory" :key="entry.session.id">
                  <div class="row">
                    <div class="row-text">
                      <b x-text="detailDate(entry)"></b>
                      <small x-text="setLine(entry)"></small>
                    </div>
                    <span class="row-num" x-text="detailTotal(entry)"></span>
                  </div>
                </template>
              </div>

              <p class="empty" x-show="!detailHistory.length">No history for this exercise yet.</p>
            </div>
          </div>
        </template>

        <!-- Routine builder --------------------------------------------------- -->
        <template x-if="builder">
          <div class="sheet-backdrop" @click.self="closeBuilder()">
            <div class="sheet" x-init="$swipe($el, () =&gt; { closeBuilder() })">
              <div class="grabber"></div>
              <!-- View ------------------------------------------------------ -->
              <template x-if="builder.mode === 'view'">
                <div style="display:flex; flex-direction:column; gap:var(--space-4)">
                  <div class="sheet-head">
                    <h2 x-text="builder.name"></h2>
                    <button class="tap" @click="closeBuilder()" aria-label="Close">×</button>
                  </div>

                  <div class="rows">
                    <template x-for="row in builderExercises" :key="row.item.id">
                      <button class="row" @click="openExercise(row.item.exercise_id, row.name)">
                        <span class="thumb" x-html="muscleMap(row.item.exercise_id, row.name)"></span>
                        <div class="row-text">
                          <b x-text="row.name"></b>
                          <small x-text="lastLine(row)"></small>
                        </div>
                        <span class="tap">›</span>
                      </button>
                    </template>
                  </div>

                  <p class="empty" x-show="!builderExercises.length">No exercises in this routine.</p>

                  <button class="btn btn-primary btn-block" @click="startFromBuilder()">Start workout</button>
                  <div class="btn-row">
                    <button class="btn" @click="toEdit()">Edit</button>
                    <button class="btn btn-danger" @click="deleteFromBuilder()">Delete</button>
                  </div>
                </div>
              </template>

              <!-- Edit ------------------------------------------------------ -->
              <template x-if="builder.mode === 'edit'">
                <div>
              <div class="card-label" x-text="builder.routine ? 'Edit routine' : 'New routine'"></div>

              <div class="field">
                <label for="rt-name">Name</label>
                <input id="rt-name" type="text" x-model="builder.name" placeholder="Push A"
                       autocomplete="off" @change="saveRoutineName()">
              </div>

              <!-- Free text, because the categories you want are not knowable in
                   advance. The chips exist so an existing one is a tap rather
                   than a retype — "Upper" and "upper" grouping separately is
                   correct behaviour and still not what anyone wants to see. -->
              <div class="field">
                <label for="rt-cat">Category <small>optional</small></label>
                <input id="rt-cat" type="text" x-model="builder.category" placeholder="Upper"
                       autocomplete="off" @change="saveRoutineName()">
                <div class="chips" x-show="knownCategories.length" x-cloak>
                  <template x-for="c in knownCategories" :key="c">
                    <button class="chip" :class="builder.category === c && 'is-active'"
                            @click="builder.category = builder.category === c ? '' : c;
                                    saveRoutineName()" x-text="c"></button>
                  </template>
                </div>
              </div>

              <template x-if="builder.routine">
                <div>
                  <div class="rows" x-ref="builderrows">
                    <template x-for="row in builderExercises" :key="row.item.id">
                      <div class="row" data-card :data-key="row.item.id">
                        <span class="grip" aria-hidden="true"
                              x-init="$dragCard($el,
                                        () => [...$refs.builderrows.querySelectorAll('[data-card]')],
                                        (to, key) => reorderRoutineItemTo(key, to))">⠿</span>
                        <span class="thumb" x-html="muscleMap(row.item.exercise_id, row.name)"></span>
                        <div class="row-text"><b x-text="row.name"></b></div>
                        <button class="tap" @click="dropRoutineItem(row.item)"
                                :aria-label="`Remove ${row.name}`">×</button>
                      </div>
                    </template>
                  </div>

                  <p class="empty" x-show="!builderExercises.length">No exercises yet.</p>
                  <button class="btn btn-block" @click="openPicker()">Add exercise</button>
                </div>
              </template>

              <p class="empty" x-show="!builder.routine">Name it first, then add exercises.</p>
              <button class="btn btn-primary btn-block" @click="saveRoutineName(); closeBuilder()">Done</button>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- Finish ----------------------------------------------------------- -->
        <template x-if="finishing">
          <div class="sheet-backdrop" @click.self="finishing = false">
            <div class="sheet" x-init="$swipe($el, () =&gt; { finishing = false })">
              <div class="grabber"></div>
              <div class="card-label">Finish workout</div>
              <p style="font-size: var(--text-sm); color: var(--color-text-muted)">
                <span x-text="groups.length"></span> exercises ·
                <span x-text="volume.toLocaleString()"></span> lb ·
                <span x-text="elapsed"></span>
              </p>
              <!-- Only when this workout came from a routine that still exists.
                   Off by default: a workout is usually a one-off, not a new plan. -->
              <template x-if="startedFrom">
                <label class="opt-in">
                  <input type="checkbox" x-model="updateRoutine">
                  <span>
                    Update “<span x-text="startedFrom.name"></span>” with what I did
                    <small>Replaces its exercises, sets and weights. Its history is kept.</small>
                  </span>
                </label>
              </template>

              <div class="field">
                <label for="r-name">Save as routine (optional)</label>
                <input id="r-name" type="text" x-model="routineName" placeholder="Push A" autocomplete="off">
              </div>
              <button class="btn btn-primary btn-block" @click="finishSession()">Finish</button>
              <div class="btn-row">
                <button class="btn" @click="finishing = false">Cancel</button>
                <button class="btn btn-danger" @click="discard()">Discard</button>
              </div>
            </div>
          </div>
        </template>
      </main>
      </template>

      <template x-if="$store.ui.view === 'stats'">
      <main class="app-main" x-data="statsPage">

        <!-- Targets ---------------------------------------------------------- -->
        <div class="card">
          <div class="readout-head">
            <div>
              <div class="card-label">Targets</div>
              <div class="stat-hero" x-show="goal">
                <span x-text="goal && (goal.calorie_target || '—')"></span><small>kcal</small>
              </div>
              <div class="stat-sub" x-show="goal">
                <span x-text="goal && (goal.phase || 'no phase set')"></span>
                <span x-show="goal && goal.target_weight_lb">
                  · target <span x-text="goal && goal.target_weight_lb"></span> lb
                </span>
              </div>
            </div>
            <button class="btn" @click="editGoal()" x-text="goal ? 'Edit' : 'Set'"></button>
          </div>

          <div class="macros" x-show="goal && goal.protein_target_g">
            <template x-for="m in [
              { k: 'protein_target_g', n: 'Protein', c: 'var(--color-protein)' },
              { k: 'carbs_target_g',   n: 'Carbs',   c: 'var(--color-carbs)' },
              { k: 'fat_target_g',     n: 'Fat',     c: 'var(--color-fat)' }
            ]" :key="m.k">
              <div class="macro">
                <span class="dot" :style="`background: ${m.c}`"></span>
                <span class="macro-name" x-text="m.n"></span>
                <span class="macro-val" style="margin-left:auto"
                      x-text="goal && ((goal[m.k] ?? '—') + ' g')"></span>
              </div>
            </template>
          </div>

          <p class="empty" style="padding:var(--space-3) 0" x-show="!goal">
            No targets yet. Set them and the Today screen starts showing progress.
          </p>
        </div>

        <!-- Body weight ------------------------------------------------------ -->
        <div class="card">
          <div class="readout-head">
            <div>
              <div class="card-label">Body weight</div>
              <div class="stat-hero" x-show="weightSummary">
                <span x-text="weightSummary && weightSummary.latest"></span><small>lb</small>
              </div>
              <div class="stat-sub" x-show="weightSummary && weightSummary.target">
                <span x-text="weightSummary && Math.abs(weightSummary.toGo)"></span> lb
                <span x-text="weightSummary && weightSummary.toGo > 0 ? 'to go' : 'past target'"></span>
              </div>
            </div>
            <button class="btn" @click="weighing = true">Log</button>
          </div>

          <!-- One series, so the heading names it and no legend is needed.
               preserveAspectRatio is deliberately not "none" here: the old chart
               stretched, which skews a slope into whatever the card width says. -->
          <template x-if="weightPlot && weight.length > 1">
            <!-- Tap to select, and it stays selected. pointermove is guarded on
                 $event.buttons, which is 1 only while a finger, pen or held mouse
                 button is actually down — so dragging scrubs along the series and
                 a mouse merely passing over does nothing. Nothing clears the
                 selection on the way out, because a readout that vanishes when
                 you lift your finger is no use on a phone. -->
            <div class="plot" @pointerdown="trackWeight($event)"
                 @pointermove="if ($event.buttons) trackWeight($event)">
              <!-- viewBox is set imperatively, not with :viewBox. The HTML parser
                   lowercases attribute names, so :viewBox arrives as :viewbox and
                   Alpine sets "viewbox" — which SVG, being case-sensitive, ignores
                   entirely. The result is an SVG with no viewBox at all: it takes
                   the default 100%x150px while the paths stay in 100x32 user units,
                   drawing the whole chart as a sliver in the top-left corner. -->
              <svg x-effect="$el.setAttribute('viewBox', `0 0 ${weightPlot.width} ${weightPlot.height}`)"
                   role="img" aria-label="Body weight over time">
                <!-- Target line, recessive: context, not data. -->
                <line x-show="weightPlot.targetY !== null" x-cloak
                      x1="0" :x2="weightPlot.width"
                      :y1="weightPlot.targetY" :y2="weightPlot.targetY"
                      class="plot-target"/>
                <path :d="weightPlot.area" class="plot-area"/>
                <path :d="weightPlot.line" class="plot-line"/>

                <!-- Crosshair on the snapped reading. -->
                <line x-show="weightHover" x-cloak
                      :x1="weightHover && weightHover.x" :x2="weightHover && weightHover.x"
                      y1="0" :y2="weightPlot.height" class="plot-crosshair"/>

                <g x-html="weightDots"></g>
              </svg>

              <!-- Values lead, the date follows. -->
              <div class="plot-readout" x-show="weightFocus" x-cloak>
                <b x-text="weightFocus && `${weightFocus.lb} lb`"></b>
                <span x-text="weightFocus && weightDate(weightFocus.at, { long: true })"></span>
              </div>
            </div>
          </template>

          <p class="empty" style="padding:var(--space-3) 0" x-show="weight.length < 2">
            Log your weight a couple of times and a trend appears here.
          </p>

          <!-- Trajectory, in words first. -->
          <div class="stat-grid" x-show="weight.length > 1" x-cloak>
            <div class="stat-cell">
              <small>Weekly trend</small>
              <b x-text="weightTrend.enough
                   ? signed(weightTrend.lbPerWeek, ' lb')
                   : 'Not yet'"></b>
            </div>
            <div class="stat-cell" x-show="weightWeek.change !== null">
              <small>Last 7 days</small>
              <b x-text="signed(weightWeek.change, ' lb')"></b>
            </div>
            <div class="stat-cell" x-show="weightMonth.change !== null">
              <small>Last 30 days</small>
              <b x-text="signed(weightMonth.change, ' lb')"></b>
            </div>
            <div class="stat-cell" x-show="weightTrend.weeksAway">
              <small>At this rate</small>
              <b x-text="weightTrend.projectedAt ? weightDate(weightTrend.projectedAt) : '—'"></b>
            </div>
          </div>

          <p class="plot-note" x-show="weight.length > 1" x-cloak
             x-text="trendConfidence"></p>

          <button class="btn btn-ghost btn-block" x-show="weightReadings.length" x-cloak
                  @click="weightOpen = !weightOpen"
                  x-text="weightOpen ? 'Hide every reading' : `All ${weightReadings.length} readings`"></button>

          <!-- The table view. Also what makes the low-contrast stroke acceptable:
               every plotted value is readable without hovering anything. -->
          <div class="rows" x-show="weightOpen" x-cloak>
            <template x-for="r in weightReadings" :key="r.at">
              <div class="row">
                <div class="row-text">
                  <b x-text="weightDate(r.at, { long: true })"></b>
                  <small x-text="gapLabel(r.daysSincePrevious)"></small>
                </div>
                <span class="row-num" x-text="`${r.lb} lb`"></span>
                <span class="delta"
                      :class="{ 'is-down': r.delta < 0, 'is-up': r.delta > 0 }"
                      x-text="signed(r.delta)"></span>
              </div>
            </template>
          </div>

          <div class="stat-grid" x-show="weightOpen && weightExtremes" x-cloak>
            <div class="stat-cell">
              <small>Highest</small>
              <b x-text="weightExtremes && `${weightExtremes.high.lb} lb`"></b>
              <span x-text="weightExtremes && weightDate(weightExtremes.high.at)"></span>
            </div>
            <div class="stat-cell">
              <small>Lowest</small>
              <b x-text="weightExtremes && `${weightExtremes.low.lb} lb`"></b>
              <span x-text="weightExtremes && weightDate(weightExtremes.low.at)"></span>
            </div>
            <div class="stat-cell">
              <small>Range</small>
              <b x-text="weightExtremes && `${weightExtremes.range} lb`"></b>
            </div>
          </div>
        </div>

        <!-- Muscle balance ---------------------------------------------------- -->
        <div class="card" x-show="muscleBalance.sessions" x-cloak>
          <div class="readout-head">
            <div>
              <div class="card-label">Muscle balance</div>
              <div class="stat-hero">
                <span x-text="muscleRanked[0] && Math.round(muscleRanked[0].share * 100)"></span><small>%</small>
              </div>
              <div class="stat-sub">
                <span x-text="muscleRanked[0] && muscleRanked[0].label.toLowerCase()"></span>,
                your most trained · last 12 weeks
              </div>
            </div>
          </div>

          <!-- One series, so no legend: the spokes are labelled and the shape is
               the only thing drawn. Selection snaps by angle — see trackMuscle. -->
          <div class="plot plot-radar" @pointerdown="trackMuscle($event)"
               @pointermove="if ($event.buttons) trackMuscle($event)">
            <!-- Built as a string, not x-for: a <template> inside <svg> is
                 parsed in the SVG namespace and never runs. The dashed inner
                 outline is what an even split across six groups would draw, so
                 the shape is compared against something rather than nothing. -->
            <svg viewBox="0 0 100 100" role="img" :aria-label="muscleAria">
              <g x-html="radarMarks"></g>
            </svg>

            <div class="plot-readout" x-show="muscleFocus" x-cloak>
              <b x-text="muscleFocus && `${muscleFocus.percent}% ${muscleFocus.label.toLowerCase()}`"></b>
              <span x-text="muscleFocus && `${muscleFocus.volume.toLocaleString()} lb over 12 weeks`"></span>
            </div>
          </div>

          <!-- Every number the shape encodes, in text. A radar's area grows with
               the square of its radius, so the picture overstates a difference
               the reader can check here. -->
          <div class="stat-grid">
            <template x-for="g in muscleRanked" :key="g.key">
              <div class="stat-cell">
                <small x-text="g.label"></small>
                <b x-text="`${Math.round(g.share * 100)}%`"></b>
                <span x-text="`${g.volume.toLocaleString()} lb`"></span>
              </div>
            </template>
          </div>

          <p class="plot-note">
            <span x-text="`Working sets only, across ${count(muscleBalance.sessions, 'workout')}.`"></span>
            <span x-show="muscleBalance.unplaced"
                  x-text="` ${muscleBalance.unplaced.toLocaleString()} lb is not counted — the muscle map cannot place those exercises.`"></span>
          </p>
        </div>

        <!-- Training --------------------------------------------------------- -->
        <div class="card">
          <div class="readout-head">
            <div>
              <div class="card-label">Weekly volume</div>
              <div class="stat-hero">
                <span x-text="thousands(thisWeek.volume)"></span><small>lb</small>
              </div>
              <div class="stat-sub">
                <span x-text="thisWeek.sessions"></span> sessions this week
              </div>
            </div>
          </div>

          <!-- Bars as elements rather than an x-html string, so a pointer has
               something to interrogate. Selection snaps by slot, not by rectangle:
               an untrained week has no bar to hit and is still a week you can
               ask about. -->
          <div class="plot" @pointerdown="trackVolume($event)"
               @pointermove="if ($event.buttons) trackVolume($event)">
            <svg x-effect="$el.setAttribute('viewBox', `0 0 ${volumePlot.width} ${volumePlot.height}`)"
                 role="img" aria-label="Training volume by week, last 12 weeks">
              <g x-html="volumeBars"></g>
            </svg>

            <div class="plot-readout" x-show="volumeFocus" x-cloak>
              <b x-text="volumeFocus && `${volumeFocus.volume.toLocaleString()} lb`"></b>
              <span x-text="volumeFocus && `week of ${weekOf(volumeFocus.start)} · ${
                count(volumeFocus.sessions, 'session')}`"></span>
            </div>
          </div>

          <div class="stat-grid" x-show="volumeStats" x-cloak>
            <div class="stat-cell" x-show="volumeStats && volumeStats.change !== null">
              <small>Vs last week</small>
              <b x-text="volumeStats && signed(volumeStats.change / 1000, 'k lb')"></b>
            </div>
            <div class="stat-cell">
              <small>Weekly average</small>
              <b x-text="volumeStats && thousands(volumeStats.average) + ' lb'"></b>
            </div>
            <div class="stat-cell" x-show="volumeStats && volumeStats.best">
              <small>Best week</small>
              <b x-text="volumeStats && thousands(volumeStats.best.volume) + ' lb'"></b>
              <span x-text="volumeStats && weekOf(volumeStats.best.start)"></span>
            </div>
            <div class="stat-cell">
              <small>Sessions / wk</small>
              <b x-text="volumeStats && volumeStats.perWeek"></b>
            </div>
          </div>

          <!-- The comparison is against a finished week, so say when it isn't fair. -->
          <p class="plot-note" x-show="volumeStats" x-cloak
             x-text="volumeStats && (volumeStats.partial
               ? `This week is ${count(volumeStats.daysIn, 'day')} old — the comparison catches up as it fills.`
               : `Averaged over the ${volumeStats.weeksTrained} of ${volumeStats.weeks} weeks you trained.`)"></p>

          <button class="btn btn-ghost btn-block" x-show="sessions.length" x-cloak
                  @click="volumeOpen = !volumeOpen"
                  x-text="volumeOpen ? 'Hide sessions' : `Last ${sessions.length} sessions`"></button>

          <div class="rows" x-show="volumeOpen" x-cloak>
            <template x-for="s in sessions" :key="s.id">
              <div class="row">
                <div class="row-text">
                  <b x-text="s.name"></b>
                  <small x-text="`${weightDate(s.at, { long: true })} · ${
                    count(s.sets, 'set')} · ${count(s.exercises, 'exercise', 'exercises')}${
                    s.minutes ? ` · ${duration(s.minutes)}` : ''}`"></small>
                </div>
                <span class="row-num" x-text="s.volume ? `${thousands(s.volume)} lb` : '—'"></span>
              </div>
            </template>
          </div>
        </div>

        <!-- Consistency ------------------------------------------------------ -->
        <div class="card" x-show="consistency.any" x-cloak>
          <div class="readout-head">
            <div>
              <div class="card-label">Consistency</div>
              <div class="stat-hero">
                <span x-text="consistency.weekStreak"></span><small>week streak</small>
              </div>
              <div class="stat-sub"
                   x-text="consistency.daysSinceLast === 0
                     ? 'Trained today'
                     : `${count(consistency.daysSinceLast, 'day')} since the last one`"></div>
            </div>
          </div>

          <!-- One square per day, twelve weeks. A calendar answers "how often"
               in a way a number cannot: the gaps are visible as gaps. -->
          <div class="plot" @pointerdown="trackGrid($event)"
               @pointermove="if ($event.buttons) trackGrid($event)">
            <svg class="grid-plot"
                 x-effect="$el.setAttribute('viewBox', `0 0 ${gridBox.width} ${gridBox.height}`)"
                 role="img" aria-label="Days trained over the last twelve weeks"
                 x-html="gridCells"></svg>

            <div class="plot-readout" x-show="gridReadout" x-cloak>
              <b x-text="gridReadout && gridReadout.what"></b>
              <span x-text="gridReadout && gridReadout.date"></span>
            </div>
          </div>

          <div class="stat-grid">
            <div class="stat-cell">
              <small>Day streak</small>
              <b x-text="consistency.dayStreak"></b>
              <span x-text="`best ${consistency.bestDayStreak}`"></span>
            </div>
            <div class="stat-cell">
              <small>Week streak</small>
              <b x-text="consistency.weekStreak"></b>
              <span x-text="`best ${consistency.bestWeekStreak}`"></span>
            </div>
            <div class="stat-cell">
              <small>Longest gap</small>
              <b x-text="count(consistency.longestGap, 'day')"></b>
            </div>
            <div class="stat-cell">
              <small>Days trained</small>
              <b x-text="consistency.trainedDays"></b>
              <span x-text="count(consistency.sessions, 'session')"></span>
            </div>
          </div>
        </div>

        <!-- Top lifts -------------------------------------------------------- -->
        <div class="card" x-show="lifts.length">
          <div class="card-label">Best lifts · estimated 1RM</div>
          <div class="rows">
            <template x-for="lift in lifts" :key="lift.name">
              <div>
                <!-- The whole row is the control: a lift with two years behind it
                     should not need a chevron explaining that it opens. -->
                <button class="row row-tap" @click="toggleLift(lift)"
                        :aria-expanded="liftOpen === lift.name">
                  <div class="row-text">
                    <b x-text="lift.name"></b>
                    <small><span x-text="lift.sessions"></span> sessions</small>
                  </div>
                  <span class="pill" x-show="lift.isBest">PR</span>
                  <span class="row-num"><span x-text="lift.best"></span> lb</span>
                </button>

                <template x-if="liftOpen === lift.name && liftDetail">
                  <div class="lift-detail">
                    <svg class="plot-mini"
                         x-effect="$el.setAttribute('viewBox', `0 0 ${liftDetail.plot.width} ${liftDetail.plot.height}`)"
                         role="img" :aria-label="`Estimated 1RM for ${liftDetail.name} over time`"
                         x-html="liftLine"></svg>

                    <div class="stat-grid">
                      <div class="stat-cell">
                        <small>Latest</small>
                        <b x-text="`${liftDetail.latest} lb`"></b>
                      </div>
                      <div class="stat-cell" x-show="liftDetail.change !== null">
                        <small>Last <span x-text="liftDetail.sessions"></span></small>
                        <b x-text="signed(liftDetail.change, ' lb', 0)"></b>
                      </div>
                      <div class="stat-cell" x-show="liftDetail.heaviest && liftDetail.heaviest.best">
                        <small>Heaviest set</small>
                        <b x-text="liftDetail.heaviest && liftDetail.heaviest.best
                             ? `${liftDetail.heaviest.best.weight_lb} × ${liftDetail.heaviest.best.reps}`
                             : '—'"></b>
                        <span x-text="liftDetail.heaviest && weightDate(liftDetail.heaviest.date)"></span>
                      </div>
                    </div>

                    <div class="rows">
                      <template x-for="h in liftDetail.recent" :key="h.at">
                        <div class="row">
                          <div class="row-text">
                            <b x-text="weightDate(h.at, { long: true })"></b>
                            <small x-text="`${h.weight ?? '—'} × ${h.reps ?? '—'} · ${
                              count(h.sets, 'set')}`"></small>
                          </div>
                          <span class="row-num" x-text="`${h.oneRm} lb`"></span>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>

        <!-- Nutrition -------------------------------------------------------- -->
        <div class="card" x-show="calorieSummary">
          <div class="readout-head">
            <div>
              <div class="card-label">Calories · 14 day average</div>
              <div class="stat-hero">
                <span x-text="calorieSummary && calorieSummary.average.toLocaleString()"></span><small>kcal</small>
              </div>
              <div class="stat-sub" x-show="calorieSummary && calorieSummary.delta !== null">
                <span x-text="calorieSummary && Math.abs(calorieSummary.delta)"></span>
                <span x-text="calorieSummary && calorieSummary.delta > 0 ? 'over target' : 'under target'"></span>
                · <span x-text="calorieSummary && count(calorieSummary.loggedDays, 'day')"></span> logged
              </div>
            </div>
          </div>

          <div class="plot" x-show="loggedDays > 1" x-cloak
               @pointerdown="trackCalories($event)"
               @pointermove="if ($event.buttons) trackCalories($event)">
            <svg x-effect="$el.setAttribute('viewBox', `0 0 ${caloriePlot.width} ${caloriePlot.height}`)"
                 role="img" aria-label="Daily calories over the last 14 days">
              <line x-show="caloriePlot.targetY !== null" x-cloak
                    x1="0" :x2="caloriePlot.width"
                    :y1="caloriePlot.targetY" :y2="caloriePlot.targetY"
                    class="plot-target"/>
              <g x-html="calorieBars"></g>
            </svg>

            <div class="plot-readout" x-show="calorieFocus" x-cloak>
              <b x-text="calorieFocus && (calorieFocus.logged
                   ? `${calorieFocus.kcal.toLocaleString()} kcal`
                   : 'Not logged')"></b>
              <span x-text="calorieFocus && `${weightDate(calorieFocus.date.toISOString(), { long: true })}${
                calorieFocus.logged && calorieFocus.target
                  ? ` · ${signed(calorieFocus.kcal - calorieFocus.target, '', 0)} vs target`
                  : ''}`"></span>
            </div>
          </div>

          <p class="empty" style="padding:var(--space-3) 0" x-show="loggedDays < 2" x-cloak>
            Log a couple of days and the chart fills in.
          </p>

          <div class="stat-grid" x-show="adherence" x-cloak>
            <div class="stat-cell">
              <small>On target</small>
              <b x-text="adherence && `${adherence.on} / ${adherence.days}`"></b>
              <span x-text="adherence && `within ${adherence.slack}`"></span>
            </div>
            <div class="stat-cell">
              <small>Over · under</small>
              <b x-text="adherence && `${adherence.over} · ${adherence.under}`"></b>
            </div>
            <div class="stat-cell">
              <small>Logged streak</small>
              <b x-text="streak.current"></b>
              <span x-text="`best ${streak.best}`"></span>
            </div>
            <div class="stat-cell" x-show="adherence && adherence.biggest">
              <small>Biggest miss</small>
              <b x-text="adherence && signed(adherence.biggest.delta, '', 0)"></b>
              <span x-text="adherence && weightDate(adherence.biggest.date.toISOString())"></span>
            </div>
          </div>

          <p class="plot-note" x-show="adherence && adherence.unlogged" x-cloak
             x-text="adherence && `${adherence.unlogged} of the ${adherence.unlogged + adherence.days} days aren't logged, so they count for nothing here.`"></p>

          <button class="btn btn-ghost btn-block" @click="calorieOpen = !calorieOpen"
                  x-text="calorieOpen ? 'Hide days' : 'Every day'"></button>

          <div class="rows" x-show="calorieOpen" x-cloak>
            <template x-for="d in [...caloriePlot.bars].reverse()" :key="d.i">
              <div class="row">
                <div class="row-text">
                  <b x-text="weightDate(d.date.toISOString(), { long: true })"></b>
                  <small x-text="d.logged
                    ? (d.target ? `target ${d.target.toLocaleString()}` : 'no target set')
                    : 'nothing logged'"></small>
                </div>
                <span class="row-num" x-text="d.logged ? d.kcal.toLocaleString() : '—'"></span>
                <span class="delta" x-show="d.logged && d.target"
                      :class="{ 'is-down': d.kcal < d.target, 'is-up': d.kcal > d.target }"
                      x-text="d.logged && d.target ? signed(d.kcal - d.target, '', 0) : ''"></span>
              </div>
            </template>
          </div>
        </div>

        <p class="empty" x-show="!lifts.length && !calorieSummary && weight.length < 2">
          Log a workout, a meal or your weight and this fills in.
        </p>

        <!-- Edit targets ----------------------------------------------------- -->
        <template x-if="editing">
          <div class="sheet-backdrop" @click.self="editing = false">
            <div class="sheet" x-init="$swipe($el, () => { editing = false })">
              <div class="grabber"></div>
              <div class="sheet-head">
                <h2>Targets</h2>
                <button class="tap" @click="editing = false" aria-label="Close">×</button>
              </div>

              <div class="field">
                <label>Phase</label>
                <div class="chips">
                  <template x-for="p in ['cut', 'maintain', 'bulk']" :key="p">
                    <button class="chip" :class="draft.phase === p && 'is-active'"
                            @click="draft.phase = p" x-text="p"></button>
                  </template>
                </div>
              </div>

              <div class="field-grid">
                <div class="field">
                  <label for="g-kcal">Calories</label>
                  <input id="g-kcal" type="number" inputmode="numeric" x-model="draft.calorie_target">
                </div>
                <div class="field">
                  <label for="g-weight">Target weight lb</label>
                  <input id="g-weight" type="number" inputmode="decimal" step="0.1" x-model="draft.target_weight_lb">
                </div>
                <div class="field">
                  <label for="g-p">Protein g</label>
                  <input id="g-p" type="number" inputmode="numeric" x-model="draft.protein_target_g">
                </div>
                <div class="field">
                  <label for="g-c">Carbs g</label>
                  <input id="g-c" type="number" inputmode="numeric" x-model="draft.carbs_target_g">
                </div>
                <div class="field">
                  <label for="g-f">Fat g</label>
                  <input id="g-f" type="number" inputmode="numeric" x-model="draft.fat_target_g">
                </div>
              </div>

              <!-- The macros either add up to the calorie target or they don't. -->
              <p class="infood" x-show="draftMacroKcal">
                Macros add up to <span x-text="draftMacroKcal"></span> kcal<span
                  x-show="draftMismatch"> · <span
                  x-text="Math.abs(draftMismatch)"></span> <span
                  x-text="draftMismatch > 0 ? 'over' : 'under'"></span> your target</span>
              </p>

              <button class="btn btn-primary btn-block" @click="saveGoal()">Update current targets</button>
              <button class="btn btn-block" @click="saveNewPhase()">
                Start a new <span x-text="draft.phase"></span> from today
              </button>

              <p class="stat-sub">
                Updating changes the phase you're in. Starting a new one closes it
                yesterday, so what you were aiming for before stays on record.
              </p>

              <div x-show="phases.length > 1">
                <div class="card-label" style="padding-top:var(--space-2)">Previous phases</div>
                <div class="rows">
                  <template x-for="p in phases.slice(1)" :key="p.id">
                    <div class="row">
                      <div class="row-text">
                        <b x-text="p.phase || 'phase'"></b>
                        <small><span x-text="p.starts_on"></span> → <span x-text="p.ends_on || 'open'"></span></small>
                      </div>
                      <span class="row-num" x-text="(p.calorie_target || '—') + ' kcal'"></span>
                    </div>
                  </template>
                </div>
              </div>
            </div>
          </div>
        </template>

        <!-- Log weight ------------------------------------------------------- -->
        <template x-if="weighing">
          <div class="sheet-backdrop" @click.self="weighing = false">
            <div class="sheet" x-init="$swipe($el, () => { weighing = false })">
              <div class="grabber"></div>
              <div class="sheet-head">
                <h2>Log weight</h2>
                <button class="tap" @click="weighing = false" aria-label="Close">×</button>
              </div>
              <div class="field">
                <label for="w-lb">Pounds</label>
                <input id="w-lb" type="number" inputmode="decimal" step="0.1"
                       x-model="newWeight" placeholder="184.2" autocomplete="off">
              </div>
              <button class="btn btn-primary btn-block" :disabled="!newWeight" @click="saveWeight()">Save</button>
            </div>
          </div>
        </template>
      </main>
      </template>

      <!-- Status + nav ----------------------------------------------------- -->
      <div class="app-main" style="flex: none; padding-bottom: var(--space-3);">
        <div class="sync-line">
          <span :class="$store.sync.dotClass"></span>
          <span x-text="$store.sync.label"></span>
        </div>
        <div class="notice notice-error" x-show="$store.sync.error" x-text="$store.sync.error"></div>
      </div>

      <!-- The way food gets added. Log is a panel over this screen, not a
           destination you navigate to and come back from. -->
      <div class="fab-stack" x-show="$store.ui.view === 'today' && !$store.ui.logOpen">
        <button class="fab fab-secondary" x-show="$store.ui.canScan"
                @click="$store.ui.startScan()" aria-label="Scan a barcode">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.2l1.3-2h7.9l1.3 2h2.3A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-9Z"/>
            <circle cx="12" cy="13" r="3.4"/>
          </svg>
        </button>
        <button class="fab" @click="$store.ui.openLog()" aria-label="Add food">+</button>
      </div>

      <nav class="tabbar">
        <button :class="$store.ui.view === 'today' && 'is-active'" @click="$store.ui.go('today')">Today</button>
        <button :class="$store.ui.view === 'train' && 'is-active'" @click="$store.ui.go('train')">Train</button>
        <button :class="$store.ui.view === 'stats' && 'is-active'" @click="$store.ui.go('stats')">Stats</button>
      </nav>

      <div class="toast" x-show="$store.ui.toast" x-transition x-cloak x-text="$store.ui.toast"></div>

      <template x-if="$store.ui.settingsOpen">
        <div class="sheet-backdrop" @click.self="$store.ui.settingsOpen = false">
          <div class="sheet" x-init="$swipe($el, () => { $store.ui.settingsOpen = false })">
            <div class="grabber"></div>
            <div class="sheet-head">
              <h2>Settings</h2>
              <button class="tap" @click="$store.ui.settingsOpen = false" aria-label="Close">×</button>
            </div>

            <div class="card-label">Notifications</div>

            <!-- Permission is the browser's, not ours: once denied it cannot be
                 asked for again from script, so the row says so rather than
                 offering a switch that would do nothing. -->
            <label class="setting" :class="{ 'is-dead': ['unsupported', 'blocked'].includes($store.ui.notifications) }">
              <span class="setting-text">
                <b>Push notifications</b>
                <small x-text="$store.ui.notifications === 'on'
                  ? 'Forgotten workouts, and anything below you turn on'
                  : $store.ui.notificationLabel"></small>
              </span>
              <input type="checkbox" role="switch"
                     :checked="$store.ui.notifications === 'on'"
                     :disabled="['unsupported', 'blocked', 'unknown'].includes($store.ui.notifications)"
                     @change="await $store.ui.toggleNotifications();
                              $el.checked = $store.ui.notifications === 'on'">
            </label>

            <label class="setting"
                   :class="{ 'is-dead': $store.ui.notifications !== 'on' && !$store.ui.prefs.morning_quotes }">
              <span class="setting-text">
                <b>Morning motivation</b>
                <small x-text="$store.ui.notifications === 'on'
                  ? 'One line at 6:30am, from your own training'
                  : $store.ui.prefs.morning_quotes
                    ? 'On for your account — this browser is not subscribed'
                    : 'Turn notifications on first'"></small>
              </span>
              <input type="checkbox" role="switch"
                     :checked="$store.ui.prefs.morning_quotes"
                     :disabled="$store.ui.prefsBusy ||
                                ($store.ui.notifications !== 'on' && !$store.ui.prefs.morning_quotes)"
                     @change="await $store.ui.toggleMorning();
                              $el.checked = $store.ui.prefs.morning_quotes">
            </label>

            <div class="card-label" style="margin-top: var(--space-4)">Account</div>
            <p class="setting-meta" x-text="$store.auth.email"></p>
            <button class="btn btn-block" @click="$store.auth.signOut()">Sign out</button>
          </div>
        </div>
      </template>

      <!-- Post-workout. Sits at the app root, not inside the Train screen: by the
           time this shows there is no session left for that component to hang off. -->
      <template x-if="$store.ui.finished">
        <div class="sheet-backdrop" @click.self="$store.ui.dismissFinished()">
          <div class="sheet celebrate"
               x-init="$swipe($el, () => { $store.ui.dismissFinished() })">
            <div class="grabber"></div>

            <div class="celebrate-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="var(--color-success)" stroke-width="1.5"/>
                <path d="M7.5 12.4l3 3 6-6.4" stroke="var(--color-success)" stroke-width="2"
                      stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>

            <h2 class="celebrate-head" x-text="$store.ui.finished.headline"></h2>
            <p class="celebrate-note" x-text="$store.ui.finished.note"></p>

            <div class="stat-grid">
              <div class="stat-cell">
                <small>Day streak</small>
                <b x-text="$store.ui.finished.consistency.dayStreak"></b>
                <span x-text="`best ${$store.ui.finished.consistency.bestDayStreak}`"></span>
              </div>
              <div class="stat-cell">
                <small>Week streak</small>
                <b x-text="$store.ui.finished.consistency.weekStreak"></b>
                <span x-text="`best ${$store.ui.finished.consistency.bestWeekStreak}`"></span>
              </div>
              <div class="stat-cell">
                <small>This session</small>
                <b x-text="$store.ui.finished.session.volume
                     ? `${($store.ui.finished.session.volume / 1000).toFixed(1)}k lb`
                     : '—'"></b>
                <span x-text="$store.ui.finished.session.elapsed"></span>
              </div>
            </div>

            <button class="btn btn-primary btn-block"
                    @click="$store.ui.dismissFinished()">Done</button>
          </div>
        </div>
      </template>

    </div>
  </template>

</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
