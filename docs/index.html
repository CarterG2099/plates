<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Plates</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
  <meta name="theme-color" content="#171512">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plates">

  <!-- No web font by design: a CDN font is a render-blocking round trip on
       every cold start, and this app is opened dozens of times a day. -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.107.0/dist/umd/supabase.js" integrity="sha384-CQbEv3UOeYwlaBLdPF5KqEagCP39Q1KpvJC6Gwa3UGjZAwMvpA+0TFxSSnrgb4MX" crossorigin="anonymous"></script>
</head>
<body>

<!-- Bare x-data roots the Alpine component tree. Without it Alpine never walks
     these templates and the page renders empty. -->
<div class="app" x-data>

  <!-- Booting ------------------------------------------------------------- -->
  <template x-if="!$store.auth.ready">
    <div class="screen-centered">
      <div class="spinner" role="status" aria-label="Loading"></div>
    </div>
  </template>

  <!-- Signed out ---------------------------------------------------------- -->
  <template x-if="$store.auth.ready && !$store.auth.session">
    <div class="screen-centered">
      <div class="mark">Plates</div>
      <p>Food and training, for the two of us.</p>
      <button class="btn btn-primary" @click="$store.auth.signIn()">Sign in with Google</button>
      <p class="sync-line" x-show="$store.auth.error" x-text="$store.auth.error"></p>
    </div>
  </template>

  <!-- Signed in, not a member --------------------------------------------- -->
  <template x-if="$store.auth.ready && $store.auth.session && !$store.auth.isMember">
    <div class="screen-centered">
      <div class="mark">Plates</div>
      <p>
        Signed in as <span x-text="$store.auth.email"></span>, but this account
        isn't on the list.
      </p>
      <p class="notice notice-error" x-show="$store.auth.error" x-text="$store.auth.error"></p>
      <button class="btn btn-ghost" @click="$store.auth.signOut()">Sign out</button>
    </div>
  </template>

  <!-- Signed in and a member ---------------------------------------------- -->
  <template x-if="$store.auth.ready && $store.auth.isMember">
    <div style="display: contents;">

      <header class="app-bar">
        <h1>Plates</h1>
        <span class="app-bar-meta" x-text="$store.auth.displayName"></span>
      </header>

      <main class="app-main" x-data="localSummary">

        <div class="sync-line">
          <span :class="$store.sync.dotClass"></span>
          <span x-text="$store.sync.label"></span>
        </div>

        <div class="notice notice-error" x-show="$store.sync.error" x-text="$store.sync.error"></div>

        <div class="card">
          <span class="card-label">Local store</span>
          <div class="rows">
            <template x-for="row in rows" :key="row.table">
              <div class="row">
                <div class="row-text"><b x-text="row.table"></b></div>
                <span class="row-num num" x-text="row.count"></span>
              </div>
            </template>
          </div>
        </div>

        <div class="card">
          <span class="card-label">Members</span>
          <div class="rows">
            <template x-for="m in $store.auth.members" :key="m.email">
              <div class="row">
                <div class="row-text">
                  <b x-text="m.display_name || m.email"></b>
                  <small x-text="m.email"></small>
                </div>
                <span class="pill" x-show="m.is_admin">Admin</span>
              </div>
            </template>
          </div>
        </div>

        <button class="btn btn-block" @click="syncNow()">Sync now</button>
        <button class="btn btn-ghost btn-block" @click="$store.auth.signOut()">Sign out</button>

      </main>
    </div>
  </template>

</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
