<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://world.openfoodfacts.org https://cdn.jsdelivr.net; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Plates</title>

  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#14171C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plates">

  <!-- No web font by design: a CDN font is a render-blocking round trip on
       every cold start, and this app is opened dozens of times a day. -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.107.0/dist/umd/supabase.js" integrity="sha384-CQbEv3UOeYwlaBLdPF5KqEagCP39Q1KpvJC6Gwa3UGjZAwMvpA+0TFxSSnrgb4MX" crossorigin="anonymous" defer></script>
</head>
<body>

<!-- Opening IndexedDB measured at 350ms on a warm profile, and it is on the
     path to the first screen with data on it. Starting it here means it runs
     while the 200KB module graph is still downloading and parsing, instead of
     after.

     No version number: an unversioned open never triggers onupgradeneeded, so
     this cannot race the real schema in local.js. The connection is closed
     immediately — holding it would make local.js's versioned open fire
     `blocked` and wait for us, which is the opposite of the point. -->
<script>
  try {
    var warm = indexedDB.open('plates');
    warm.onsuccess = function () { warm.result.close(); };
  } catch (e) { /* private mode; the app opens it the normal way */ }
</script>

<!-- Painted by the HTML parser, before Alpine exists. Without this the page is
     blank until a 100 KB framework has downloaded, parsed and walked the DOM. -->
<div id="boot">
  <div class="boot-mark">Plates</div>
</div>

<!-- Bare x-data roots the Alpine component tree. Without it Alpine never walks
     these templates and the page renders empty. -->
<div class="app" x-data :class="$store.ui.logOpen && 'has-panel'">

  <!-- Booting ------------------------------------------------------------- -->
  <!-- Held until the local read finishes too, not just auth. Painting the shell
       first and filling it 60ms later moved the whole page down as the rows
       arrived — a 0.17 layout shift to save an interval nobody can perceive.
       The local read is ~4ms of IndexedDB, so this waits on almost nothing. -->
  <template x-if="!$store.auth.ready || ($store.auth.isMember && !$store.data.ready)">
    <div class="screen-centered">
      <div class="spinner" role="status" aria-label="Loading"></div>
    </div>
  </template>

  <!-- Signed out ---------------------------------------------------------- -->
  <template x-if="$store.auth.ready && !$store.auth.session">
    <div class="screen-centered">
      <div class="mark">Plates</div>
      <p>Food and training, for the two of us.</p>
      <button class="btn btn-primary" @click="$store.auth.signIn()">Sign in with Google</button>
      <p class="sync-line" x-show="$store.auth.error" x-text="$store.auth.error"></p>
    </div>
  </template>

  <!-- Signed in, not a member --------------------------------------------- -->
  <template x-if="$store.auth.ready && $store.auth.session && !$store.auth.isMember">
    <div class="screen-centered">
      <div class="mark">Plates</div>
      <p>
        Signed in as <span x-text="$store.auth.email"></span>, but this account
        isn't on the list.
      </p>
      <p class="notice notice-error" x-show="$store.auth.error" x-text="$store.auth.error"></p>
      <button class="btn btn-ghost" @click="$store.auth.signOut()">Sign out</button>
    </div>
  </template>

  <!-- The app ------------------------------------------------------------- -->
  <template x-if="$store.auth.ready && $store.auth.isMember && $store.data.ready">
    <div style="display: contents;">

      <header class="app-bar">
        <h1>Plates</h1>
        <button class="app-bar-meta" @click="$store.ui.openSettings()"
                x-text="$store.auth.displayName" aria-label="Settings"></button>
      </header>

      <!-- Today ------------------------------------------------------------ -->
      <main class="app-main" x-data="todayPage" x-show="$store.ui.view === 'today'">

        <div class="datenav">
          <button class="tap" @click="$store.ui.shiftDay(-1)" aria-label="Previous day">‹</button>
          <button class="datenav-label" @click="$store.ui.goToday()">
            <b x-text="$store.ui.dayLabel"></b>
            <small x-show="!$store.ui.isToday">
              <span x-text="$store.ui.viewDate"></span> · tap for today
            </small>
          </button>
          <button class="tap" @click="$store.ui.shiftDay(1)" aria-label="Next day">›</button>
        </div>

        <!-- A future day with entries is a plan, not a record. Say so, so the
             numbers aren't mistaken for something already eaten. -->
        <div class="sync-line" x-show="$store.ui.isFuture && entries.length">
          <span class="dot dot-pending"></span> Planned
        </div>

        <div class="card readout">
          <div class="readout-head">
            <div>
              <div class="readout-total" x-text="round(totals.calories).toLocaleString()"></div>
              <div class="readout-of">
                <span x-show="calorieTarget">of <span x-text="calorieTarget?.toLocaleString()"></span> kcal</span>
                <span x-show="!calorieTarget">kcal · no target set</span>
              </div>
            </div>
            <div class="readout-remaining" :class="remaining !== null && remaining < 0 && 'is-over'" x-show="calorieTarget">
              <b x-text="Math.abs(remaining ?? 0).toLocaleString()"></b>
              <small x-text="(remaining ?? 0) < 0 ? 'over' : 'left'"></small>
            </div>
          </div>

          <p class="infood" x-show="remainingInFood">
            ≈ <span x-text="remainingInFood"></span>
          </p>

          <!-- The calorie readout as a loaded barbell. Width is each macro's
               share of the target; heights are equal, because a taller plate
               would read as a heavier one. -->
          <div class="rack" x-show="calorieTarget">
            <template x-for="p in plates" :key="p.key">
              <i :style="`background: ${p.colour}; width: ${p.width}%`"></i>
            </template>
            <i class="collar" x-show="plates.length"></i>
          </div>

          <div class="macros">
            <template x-for="m in [
              { key: 'protein_g', name: 'Protein', color: 'var(--color-protein)' },
              { key: 'carbs_g',   name: 'Carbs',   color: 'var(--color-carbs)' },
              { key: 'fat_g',     name: 'Fat',     color: 'var(--color-fat)' }
            ]" :key="m.key">
              <div class="macro">
                <span class="dot" :style="`background: ${m.color}`"></span>
                <span class="macro-name" x-text="m.name"></span>
                <span class="macro-bar"><i :style="`background: ${m.color}; width: ${percent(m.key)}%`"></i></span>
                <span class="macro-val">
                  <span x-text="round(totals[m.key])"></span><s x-show="target(m.key)">/<span x-text="target(m.key)"></span></s>
                </span>
              </div>
            </template>
          </div>
        </div>

        <template x-if="!entries.length">
          <p class="empty">Nothing logged yet today.</p>
        </template>

        <!-- One list, in the order things were logged. Meals used to section
             this, guessed from the clock — which was wrong for anything added
             to another day, and was answering a question nobody asked. -->
        <div class="rows" x-show="entries.length">
          <template x-for="entry in entries" :key="entry.id">
            <div class="row">
              <button class="row-text" @click="openEdit(entry)">
                <b x-text="entry.description"></b>
                <small x-text="amountLabel(entry.quantity, entry.unit)"></small>
              </button>
              <span class="row-num" x-text="round(entry.calories)"></span>
              <button class="tap" @click="removeEntry(entry.id)" :aria-label="`Remove ${entry.description}`">×</button>
            </div>
          </template>
        </div>

        <!-- Edit a logged amount ---------------------------------------------- -->
        <template x-if="edit">
          <div class="sheet-backdrop" @click.self="closeEdit()">
            <div class="sheet" x-init="$swipe($el, () =&gt; { closeEdit() })">
              <div class="grabber"></div>

              <div style="font-weight: 600;" x-text="edit.entry.description"></div>

              <!-- A lens, not a second unit: whichever chip is lit, the entry
                   is stored and shown the way it was logged. -->
              <div class="chips" x-show="editLenses.length > 1">
                <template x-for="l in editLenses" :key="l.key">
                  <button class="chip" :class="edit.lens === l.key && 'is-active'"
                          @click="setLens(l.key)" x-text="l.label"></button>
                </template>
              </div>

              <!-- Asked once per food, then never again — applyServingSize()
                   writes it onto the food itself. -->
              <template x-if="edit.lens === 'measure' && !servingSize">
                <div class="notice">
                  Nothing on record for what one serving of this measures. Take it
                  off the label once and it is known from then on.
                  <div class="serving-fix">
                    <label class="field">
                      <span>One serving is</span>
                      <input type="number" inputmode="decimal" step="any" min="0" x-model="sizeInput">
                    </label>
                    <label class="field">
                      <span>Unit</span>
                      <input type="text" x-model="sizeUnit" autocomplete="off">
                    </label>
                    <button class="btn" @click="applyServingSize()"
                            :disabled="!(Number(sizeInput) > 0)">Use it</button>
                  </div>
                </div>
              </template>

              <template x-if="edit.lens !== 'measure' || servingSize">
                <div style="display: contents;">
                  <div class="qty">
                    <button class="qty-step" @click="editStep(-1)" aria-label="Decrease">−</button>
                    <label class="qty-amount">
                      <input type="number" inputmode="decimal" step="any" min="0" x-model.number="edit.amount">
                      <small x-text="editUnitLabel"></small>
                    </label>
                    <button class="qty-step" @click="editStep(1)" aria-label="Increase">+</button>
                  </div>

                  <input class="qty-slider" type="range" min="0"
                         :max="editMax()" :step="editStepSize()" x-model.number="edit.amount"
                         :aria-label="`Amount in ${editUnitLabel}`">
                </div>
              </template>

              <p class="prefill" x-show="editStoredLabel" x-text="editStoredLabel"></p>

              <div class="macros">
                <template x-for="m in [
                  { key: 'protein_g', name: 'Protein', color: 'var(--color-protein)' },
                  { key: 'carbs_g',   name: 'Carbs',   color: 'var(--color-carbs)' },
                  { key: 'fat_g',     name: 'Fat',     color: 'var(--color-fat)' }
                ]" :key="m.key">
                  <div class="macro">
                    <span class="dot" :style="`background: ${m.color}`"></span>
                    <span class="macro-name" x-text="m.name"></span>
                    <span class="macro-val" style="margin-left: auto;"
                          x-text="editMacros[m.key] ?? '—'"></span>
                  </div>
                </template>
              </div>


              <button class="btn btn-primary btn-block" @click="saveEdit()">
                Save <span x-text="Math.round(editMacros.calories ?? 0)"></span> kcal
              </button>
              <button class="btn btn-ghost btn-block" @click="closeEdit()">Cancel</button>

              <!-- A nutrition label for the amount chosen, not for one serving:
                   it reads the same scaled macros the Save button does. -->

              <div class="nutrition" x-show="editLabel.hasAny" x-cloak>
                <div class="nf-title">Nutrition Facts</div>
                <div class="nf-serving">
                  <span>Serving size</span><span x-text="editServingLabel"></span>
                </div>
                <!-- What the box calls one serving, when it calls it anything. -->
                <div class="nf-serving nf-serving-text" x-show="editServingText" x-cloak>
                  <span>One serving is</span><span x-text="editServingText"></span>
                </div>

                <div class="nf-calories">
                  <span>Calories</span><b x-text="editLabel.calories ?? '—'"></b>
                </div>

                <div class="nf-dv">% Daily Value*</div>

                <template x-for="r in editLabel.printedRows" :key="r.key">
                  <div class="nf-row" :class="[`nf-in-${r.indent}`, r.bold && 'is-major']">
                    <span class="nf-name">
                      <span x-text="r.name"></span>
                      <span class="nf-amount" x-text="r.amount ?? '—'"></span>
                    </span>
                    <span class="nf-pct" x-text="r.percent === null ? '' : `${r.percent}%`"></span>
                  </div>
                </template>

                <div class="nf-rule" x-show="editLabel.printedMicros.length"></div>

                <template x-for="r in editLabel.printedMicros" :key="r.key">
                  <div class="nf-row">
                    <span class="nf-name">
                      <span x-text="r.name"></span>
                      <span class="nf-amount" x-text="r.amount ?? '—'"></span>
                    </span>
                    <span class="nf-pct" x-text="r.percent === null ? '' : `${r.percent}%`"></span>
                  </div>
                </template>

                <p class="nf-note">
                  * Percent Daily Values are based on a 2,000 calorie diet. Only
                  the figures the source published are listed.
                </p>
              </div>
            </div>
          </div>
        </template>

        <!-- Meal prep --------------------------------------------------------- -->
        <div class="section-head" style="margin-top: var(--space-4);"><span>Meal prep</span></div>
        <div class="chips">
          <button class="chip" x-show="entries.length" @click="openPrep('copy')">Copy day forward</button>
          <button class="chip" x-show="entries.length" @click="openPrep('save')">Save as template</button>
          <button class="chip" x-show="templates.length" @click="openPrep('apply')">Apply template</button>
        </div>

        <template x-if="prep === 'copy'">
          <div class="sheet-backdrop" @click.self="closePrep()">
            <div class="sheet" x-init="$swipe($el, () =&gt; { closePrep() })">
              <div class="grabber"></div>
              <div class="card-label">Copy this day forward</div>
              <p style="font-size: var(--text-sm); color: var(--color-text-muted)">
                Copies all <span x-text="entries.length"></span> entries from
                <span x-text="$store.ui.dayLabel.toLowerCase()"></span> onto the days that follow.
              </p>
              <div class="qty">
                <button class="qty-step" @click="copyCount = Math.max(1, copyCount - 1)" aria-label="Fewer days">−</button>
                <label class="qty-amount">
                  <input type="number" inputmode="numeric" min="1" max="14" x-model.number="copyCount">
                  <small>days</small>
                </label>
                <button class="qty-step" @click="copyCount = Math.min(14, copyCount + 1)" aria-label="More days">+</button>
              </div>
              <button class="btn btn-primary btn-block" @click="copyForward()">Copy</button>
              <button class="btn btn-ghost btn-block" @click="closePrep()">Cancel</button>
            </div>
          </div>
        </template>

        <template x-if="prep === 'save'">
          <div class="sheet-backdrop" @click.self="closePrep()">
            <div class="sheet" x-init="$swipe($el, () =&gt; { closePrep() })">
              <div class="grabber"></div>
              <div class="card-label">Save this day as a template</div>
              <div class="field">
                <label for="t-name">Name</label>
                <input id="t-name" type="text" x-model="templateName" placeholder="Cut day A" autocomplete="off">
              </div>
              <button class="btn btn-primary btn-block" :disabled="!templateName.trim()" @click="saveAsTemplate()">
                Save <span x-text="entries.length"></span> entries
              </button>
              <button class="btn btn-ghost btn-block" @click="closePrep()">Cancel</button>
            </div>
          </div>
        </template>

        <template x-if="prep === 'apply'">
          <div class="sheet-backdrop" @click.self="closePrep()">
            <div class="sheet" x-init="$swipe($el, () =&gt; { closePrep() })">
              <div class="grabber"></div>
              <div class="card-label">Add a template to <span x-text="$store.ui.dayLabel.toLowerCase()"></span></div>
              <div class="rows">
                <template x-for="t in templates" :key="t.id">
                  <div class="row">
                    <button class="row-text" @click="applyTemplate(t)">
                      <b x-text="t.name"></b>
                      <small x-text="`${(t.items || []).length} entries`"></small>
                    </button>
                    <button class="tap" @click="removeTemplate(t)" :aria-label="`Delete ${t.name}`">×</button>
                  </div>
                </template>
              </div>
              <button class="btn btn-ghost btn-block" @click="closePrep()">Cancel</button>
            </div>
          </div>
        </template>
      </main>

      <!-- Log -------------------------------------------------------------- -->
      <main class="app-main log-panel" x-data="logPage" x-show="$store.ui.logOpen" x-cloak>

        <div class="app-bar app-bar-left" style="padding-left: 0; padding-right: 0;">
          <button class="tap" @click="$store.ui.closeLog()" aria-label="Close">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <h1>Add food</h1>
          <span class="app-bar-meta" style="margin-left: auto;" x-text="$store.ui.dayLabel"></span>
          <button class="tap" @click="openMenu()" aria-label="More">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16"/>
            </svg>
          </button>
        </div>

        <div class="search-row">
          <div class="search">
            <span aria-hidden="true">⌕</span>
            <input type="search" placeholder="Search your foods…" x-model="term"
                   enterkeyhint="search" autocomplete="off">
          </div>
          <button class="tap tap-primary" x-show="canScan" @click="openScanner()"
                  aria-label="Scan a barcode">
            <svg class="icon" style="width:19px;height:19px" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
              <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.2l1.3-2h7.9l1.3 2h2.3A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-9Z"/>
              <circle cx="12" cy="13" r="3.4"/>
            </svg>
          </button>
        </div>

        <div class="chips">
          <button class="chip" :class="filter === 'recent' && 'is-active'"
                  @click="filter = filter === 'recent' ? '' : 'recent'">Recent</button>
          <button class="chip" :class="filter === 'mine' && 'is-active'"
                  @click="filter = filter === 'mine' ? '' : 'mine'">My foods</button>
          <button class="chip" :class="filter === 'recipes' && 'is-active'"
                  @click="filter === 'recipes' ? filter = '' : browseRecipes()">Recipes</button>
        </div>

        <!-- Says which filter is on, so a tap that changes the set but not the
             rows on screen still visibly does something. -->
        <div class="section-head" x-show="filter !== 'recipes'">
          <span x-text="filter === 'mine' ? 'Foods I made' : filter === 'recent' ? 'Recent foods' : 'Foods'"></span>
          <span x-text="`${results.length} shown`"></span>
        </div>

        <!-- Meals first: typing "shake" when you have a meal called Protein
             Shake means the meal, not every food with "shake" in it. -->
        <template x-if="comboResults.length">
          <div class="rows">
            <template x-for="combo in comboResults" :key="combo.id">
              <div class="row-swipe" x-init="$swipeRow($el)">
                <button class="row-remove" @click="removeMeal(combo)"
                        :aria-label="`Remove ${combo.name}`">Remove</button>

                <div class="row">
                  <button class="row-text" @click="editMeal(combo)">
                    <b x-text="combo.name"></b>
                    <small x-text="comboSummary(combo)"></small>
                  </button>
                  <span class="pill">meal</span>
                  <button class="tap tap-primary" @click="logCombo(combo)"
                          :aria-label="`Log ${combo.name}`">+</button>
                </div>
              </div>
            </template>
          </div>
        </template>

        <div class="rows">
          <template x-for="item in results" :key="item.id">
            <div class="row-swipe" x-init="$swipeRow($el)">
              <!-- Sits behind the row; a left swipe slides the row off it. -->
              <button class="row-remove" @click="removeFood(item)"
                      :aria-label="`Remove ${item.name} from my foods`">Remove</button>

              <div class="row">
                <button class="row-text" @click="openSheet(item)">
                  <b><span x-text="item.name"></span><span
                    class="brand" x-show="item.brand" x-text="` (${item.brand})`"></span></b>
                  <small>
                    <span x-text="amountLabel(item.lastQuantity ?? item.default_qty ?? item.serving_qty, item.serving_unit)"></span>
                    <span x-show="item.calories !== null"> · <span x-text="Math.round(item.calories)"></span> kcal</span>
                  </small>
                </button>
                <!-- Only appears once there's something to take back. -->
                <button class="tap" x-show="loggedToday(item)" @click="undoLast(item)"
                        :aria-label="`Remove last ${item.name}`">−</button>
                <button class="tap tap-primary" @click="quickLog(item)" :aria-label="`Log ${item.name}`">+</button>
              </div>
            </div>
          </template>
        </div>

        <template x-if="!results.length && !term && filter !== 'recipes'">
          <p class="empty">
            <span x-show="filter === 'mine'">Nothing you've made yet. Foods you log from a search stay in the main list — this is for ones you add by hand.</span>
            <span x-show="filter === 'recent'">Nothing logged yet.</span>
            <span x-show="!filter">No foods yet — add the first one.</span>
          </p>
        </template>

        <!-- Recipes from Mom's Kitchen. One serving of each is a food; the ones
             without nutrition yet link to where it gets added. -->
        <template x-if="filter === 'recipes'">
          <div class="stack">
            <div class="section-head">
              <span>Mom's Kitchen</span>
              <span x-show="recipeBook.status === 'loading'" class="spinner" style="width:12px;height:12px"></span>
            </div>
            <div class="notice notice-error" x-show="recipeBook.status === 'error'" x-text="recipeBook.error"></div>
            <p class="empty" x-show="recipeBook.status === 'done' && !recipeRows.length">
              <span x-show="term">No recipe matches that.</span>
              <span x-show="!term">No recipes yet.</span>
            </p>
            <p class="empty" x-show="recipeBook.status === 'idle' && !navigator.onLine">Recipes need a connection.</p>

            <div class="rows">
              <template x-for="r in recipeRows" :key="r.id">
                <div>
                  <button class="row" x-show="recipeHasNutrition(r)" @click="logRecipe(r)">
                    <div class="row-text">
                      <b x-text="r.title"></b>
                      <small>
                        <span x-text="Math.round(r.calories ?? 0)"></span> kcal per serving
                        <span x-show="r.servings_count" x-text="`· makes ${r.servings_count}`"></span>
                        <span x-show="r.nutrition_source === 'gemini'">· estimated</span>
                      </small>
                    </div>
                    <span class="pill" x-show="recipeMissing(r).length"
                          :title="recipeMissing(r).join(', ')"
                          x-text="`${recipeMissing(r).length} missing`"></span>
                    <span class="tap">›</span>
                  </button>
                  <a class="row" x-show="!recipeHasNutrition(r)" :href="recipeEditUrl(r)" target="_blank" rel="noopener" style="opacity:.6">
                    <div class="row-text">
                      <b x-text="r.title"></b>
                      <small>No nutrition yet — add it in Mom's Kitchen ↗</small>
                    </div>
                  </a>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- The same search, continued. Your own foods are above; these arrive a
             beat later and never reorder them. -->
        <template x-if="term && (onlineBusy || onlineResults.length || online.error)">
          <div class="stack">
            <div class="section-head">
              <span x-show="looksLikeBarcode">Open Food Facts</span>
              <span x-show="!looksLikeBarcode">From the internet</span>
              <span x-show="onlineBusy" class="spinner" style="width:12px;height:12px"></span>
            </div>

            <div class="notice notice-error" x-show="online.error" x-text="online.error"></div>
            <p class="prefill" x-show="onlineUnmatched.length"
               x-text="`Nothing matched “${onlineUnmatched.join('”, “')}” — check the spelling.`"></p>

            <div class="rows">
              <template x-for="(r, i) in onlineResults" :key="i">
                <button class="row" @click="chooseOnline(r)">
                  <div class="row-text">
                    <b x-text="r.draft.name"></b>
                    <small>
                      <span x-text="r.draft.brand ? `(${r.draft.brand})` : r.source"></span>
                      · <span x-text="Math.round(r.draft.calories ?? 0)"></span> kcal
                      <span x-show="r.draft.serving_unit === 'serving'">per serving</span>
                      <span x-show="r.draft.serving_unit !== 'serving'">/ <span x-text="r.draft.serving_qty"></span><span x-text="r.draft.serving_unit"></span></span>
                    </small>
                  </div>
                  <!-- Incomplete data is called out rather than hidden: OFF and
                       USDA both return partial entries, and a silent null would
                       become a silent zero in your day. -->
                  <span class="pill" x-show="r.missing.length"
                        :title="r.missing.join(', ')"
                        x-text="`${r.missing.length} missing`"></span>
                  <span class="tap">›</span>
                </button>
              </template>
            </div>
          </div>
        </template>

        <button class="btn btn-block" x-show="term" @click="startCreate()">
          Add “<span x-text="term"></span>” by hand
        </button>

        <div class="notice notice-error" x-show="photoError" x-text="photoError"></div>

        <template x-if="combos.length && !term && filter !== 'recipes'">
          <div class="stack">
            <div class="section-head"><span>My meals</span></div>
            <div class="rows">
              <template x-for="combo in combos" :key="combo.id">
                <div class="row-swipe" x-init="$swipeRow($el)">
                  <button class="row-remove" @click="removeMeal(combo)"
                          :aria-label="`Remove ${combo.name}`">Remove</button>

                  <div class="row">
                    <button class="row-text" @click="editMeal(combo)">
                      <b x-text="combo.name"></b>
                      <small x-text="comboSummary(combo)"></small>
                    </button>
                    <button class="tap tap-primary" @click="logCombo(combo)"
                            :aria-label="`Log ${combo.name}`">+</button>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- Menu -------------------------------------------------------------- -->
        <template x-if="menu">
          <div class="sheet-backdrop" @click.self="closeMenu()">
            <div class="sheet" x-init="$swipe($el, () =&gt; { closeMenu() })">
              <div class="grabber"></div>

              <div class="card-label">New meal</div>
              <div class="btn-row">
                <button class="btn" @click="fromMenu(() => startMeal())">Build it</button>
                <label class="btn" :class="photoBusy === 'meal' && 'is-busy'">
                  <span x-show="photoBusy !== 'meal'">From a photo</span>
                  <span x-show="photoBusy === 'meal'">Reading…</span>
                  <input type="file" accept="image/*" capture="environment"
                         @change="closeMenu(); buildMealFromPhoto($event)" hidden>
                </label>
              </div>

              <div class="card-label">Add a food</div>
              <div class="btn-row">
                <button class="btn" @click="fromMenu(() => startCreate())">By hand</button>
                <label class="btn" :class="photoBusy === 'label' && 'is-busy'">
                  <span x-show="photoBusy !== 'label'">Scan a label</span>
                  <span x-show="photoBusy === 'label'">Reading…</span>
                  <input type="file" accept="image/*" capture="environment"
                         @change="closeMenu(); readLabel($event)" hidden>
                </label>
              </div>

              <button class="btn btn-block" @click="browseMine()">My foods &amp; meals</button>
              <button class="btn btn-block" @click="browseRecipes()">From a recipe</button>
              <button class="btn btn-ghost btn-block" @click="closeMenu()">Cancel</button>
            </div>
          </div>
        </template>

        <!-- Meal builder ---------------------------------------------------- -->
        <template x-if="meal">
          <div class="sheet-backdrop" @click.self="closeMeal()">
            <div class="sheet" x-init="$swipe($el, () =&gt; { closeMeal() })">
              <div class="grabber"></div>
              <div class="card-label" x-text="meal.id ? 'Edit meal' : 'New meal'"></div>

              <div class="field">
                <label for="m-name">Name</label>
                <input id="m-name" type="text" x-model="meal.name" autocomplete="off"
                       placeholder="Protein shake">
              </div>

              <template x-if="!meal.items.length">
                <p class="empty">No ingredients yet.</p>
              </template>

              <div class="rows">
                <template x-for="(item, i) in meal.items" :key="i">
                  <div class="row">
                    <div class="row-text">
                      <b x-text="item.name || 'Removed food'"></b>
                      <small x-text="amountLabel(item.quantity, item.unit)"></small>
                    </div>
                    <button class="tap" @click="stepIngredient(i, -1)"
                            :aria-label="`Less ${item.name}`">−</button>
                    <button class="tap" @click="stepIngredient(i, 1)"
                            :aria-label="`More ${item.name}`">+</button>
                    <button class="tap" @click="removeIngredient(i)"
                            :aria-label="`Remove ${item.name}`">×</button>
                  </div>
                </template>
              </div>

              <!-- What the meal comes to, recomputed as you build it. -->
              <div class="macros" x-show="meal.items.length">
                <div class="macro">
                  <span class="macro-name">Total</span>
                  <span class="macro-val" style="margin-left: auto;">
                    <span x-text="Math.round(mealTotals.calories)"></span> kcal ·
                    P<span x-text="Math.round(mealTotals.protein_g)"></span>
                    C<span x-text="Math.round(mealTotals.carbs_g)"></span>
                    F<span x-text="Math.round(mealTotals.fat_g)"></span>
                  </span>
                </div>
              </div>

              <!-- Always open. Adding ingredients is what this sheet is for, so
                   hiding the search behind a button was a step for its own sake. -->
              <div class="search">
                <span aria-hidden="true">⌕</span>
                <input type="search" placeholder="Add an ingredient…" x-model="mealTerm"
                       autocomplete="off" enterkeyhint="search">
              </div>

              <div>
                  <div class="rows">
                    <template x-for="choice in mealChoices" :key="choice.id">
                      <button class="row" @click="addIngredient(choice)">
                        <div class="row-text">
                          <b><span x-text="choice.name"></span><span
                            class="brand" x-show="choice.brand" x-text="` (${choice.brand})`"></span></b>
                          <small x-text="amountLabel(choice.default_qty ?? choice.serving_qty, choice.serving_unit)"></small>
                        </div>
                        <span class="tap">+</span>
                      </button>
                    </template>
                  </div>

                  <!-- Same lookup as the main search. Picking one writes the
                       food, because an item points at a food_id. -->
                  <template x-if="mealTerm && (mealOnlineBusy || mealOnlineResults.length)">
                    <div class="stack">
                      <div class="section-head">
                        <span>From the internet</span>
                        <span x-show="mealOnlineBusy" class="spinner" style="width:12px;height:12px"></span>
                      </div>
                      <div class="rows">
                        <template x-for="(r, i) in mealOnlineResults" :key="i">
                          <button class="row" @click="addOnlineIngredient(r)">
                            <div class="row-text">
                              <b x-text="r.draft.name"></b>
                              <small>
                                <span x-text="r.draft.brand ? `(${r.draft.brand})` : r.source"></span>
                                · <span x-text="Math.round(r.draft.calories ?? 0)"></span> kcal
                              </small>
                            </div>
                            <span class="tap">+</span>
                          </button>
                        </template>
                      </div>
                    </div>
                  </template>
              </div>

              <div class="btn-row">
                <button class="btn btn-ghost" @click="closeMeal()">Cancel</button>
                <button class="btn btn-primary" :disabled="!canSaveMeal" @click="saveMeal()">
                  Save meal
                </button>
              </div>
            </div>
          </div>
        </template>

        <!-- Meal estimate ----------------------------------------------------- -->
        <template x-if="estimate">
          <div class="sheet-backdrop" @click.self="closeEstimate()">
            <div class="sheet" x-init="$swipe($el, () =&gt; { closeEstimate() })">
              <div class="grabber"></div>
              <div class="card-label">From the photo</div>

              <!-- Stated before the number, not after it. A calorie total with
                   no caveat reads as a measurement, and this is a guess. -->
              <p class="estimate-caveat" x-text="confidenceLabel"></p>

              <div class="readout-head">
                <div>
                  <div class="readout-total">≈ <span x-text="estimateTotals.calories"></span></div>
                  <div class="readout-of">kcal estimated</div>
                </div>
              </div>

              <div class="rows">
                <template x-for="(item, i) in estimate.items" :key="i">
                  <div class="row">
                    <div class="row-text">
                      <b x-text="item.name"></b>
                      <small>
                        <span x-show="item.portion" x-text="item.portion"></span>
                        <span x-show="item.portion"> · </span>≈<span x-text="Math.round(item.calories)"></span> kcal
                      </small>
                    </div>
                    <button class="tap" @click="removeEstimateItem(i)"
                            :aria-label="`Remove ${item.name}`">×</button>
                  </div>
                </template>
              </div>

              <p class="estimate-note" x-show="estimate.note" x-text="estimate.note"></p>

              <div class="macros">
                <div class="macro">
                  <span class="macro-name">Macros</span>
                  <span class="macro-val" style="margin-left: auto;">
                    P<span x-text="estimateTotals.protein_g"></span>
                    C<span x-text="estimateTotals.carbs_g"></span>
                    F<span x-text="estimateTotals.fat_g"></span>
                  </span>
                </div>
              </div>

              <div class="btn-row">
                <button class="btn btn-ghost" @click="closeEstimate()">Cancel</button>
                <button class="btn btn-primary" @click="logEstimate()">
                  Log ≈<span x-text="estimateTotals.calories"></span> kcal
                </button>
              </div>
            </div>
          </div>
        </template>

        <!-- Scanner --------------------------------------------------------- -->
        <template x-if="scan">
          <div class="sheet-backdrop" @click.self="closeScanner()">
            <div class="sheet" x-init="$swipe($el, () =&gt; { closeScanner() })">
              <div class="grabber"></div>
              <div class="card-label">Scan a barcode</div>

              <!-- Tap anywhere to focus there, as in a camera app. -->
              <div class="viewfinder" @click="focusHere($event)">
                <video x-ref="video" playsinline muted autoplay></video>
                <div class="reticle" aria-hidden="true"></div>
                <div class="focus-ping" x-show="scan.focusAt" x-cloak
                     :style="`left:${scan.focusAt?.left}%; top:${scan.focusAt?.top}%`"
                     aria-hidden="true"></div>
              </div>

              <!-- Zoom is the focus fix: 2× lets the barcode fill the frame from
                   outside the lens's minimum focus distance. -->
              <div class="scan-controls" x-show="scan.zoom || scan.torch || scan.canSwitch" x-cloak>
                <label class="scan-zoom" x-show="scan.zoom">
                  <input type="range" :min="scan.zoom?.min" :max="scan.zoom?.max"
                         :step="scan.zoom?.step" :value="scan.zoom?.value"
                         @input="setScanZoom($event.target.value)" aria-label="Zoom">
                  <span x-text="`${Number(scan.zoom?.value ?? 1).toFixed(1)}×`"></span>
                </label>
                <button class="tap" x-show="scan.torch" @click="toggleTorch()"
                        :class="scan.torchOn && 'tap-primary'"
                        :aria-pressed="scan.torchOn" aria-label="Torch">🔦</button>
                <button class="tap" x-show="scan.canSwitch" @click="switchScanCamera()"
                        aria-label="Try the other lens" title="Blurry? Try the other lens">🔁</button>
              </div>

              <p class="prefill" x-show="scan.message" x-text="scan.message"></p>

              <div class="sync-line" x-show="scan.status === 'starting'">
                <span class="spinner" style="width:14px;height:14px"></span> Starting camera…
              </div>
              <div class="sync-line" x-show="scan.status === 'ready'">
                <span class="spinner" style="width:14px;height:14px"></span>
                Point at the barcode — it reads on its own.
              </div>
              <div class="sync-line" x-show="scan.status === 'reading'">
                <span class="spinner" style="width:14px;height:14px"></span> Reading photo…
              </div>

              <label class="btn btn-block" style="cursor:pointer">
                Use camera app
                <input type="file" accept="image/*" capture="environment"
                       @change="decodePhoto($event)" hidden>
              </label>

              <button class="btn btn-ghost btn-block" @click="closeScanner(); startCreate()">
                Add by hand instead
              </button>
              <button class="btn btn-ghost btn-block" @click="closeScanner()">Cancel</button>
            </div>
          </div>
        </template>


        <!-- Quantity sheet ------------------------------------------------- -->
        <template x-if="sheet">
          <div class="sheet-backdrop" @click.self="closeSheet()">
            <div class="sheet" x-init="$swipe($el, () =&gt; { closeSheet() })">
              <div class="grabber"></div>

              <div>
                <div style="font-weight: 600;">
                  <span x-text="sheet.food.name"></span><span
                    class="brand" x-show="sheet.food.brand"
                    x-text="` (${sheet.food.brand})`"></span>
                </div>
              </div>

              <!-- Four ways of saying the same amount. Whichever is lit, what
                   gets stored is a quantity in the food's own unit — so the chip
                   is a spelling, not a second number. -->
              <div class="chips" x-show="sheetLenses.length > 1">
                <template x-for="l in sheetLenses" :key="l.key">
                  <button class="chip" :class="sheet.lens === l.key && 'is-active'"
                          @click="setSheetLens(l.key)" x-text="l.label"></button>
                </template>
              </div>

              <div class="qty">
                <button class="qty-step" @click="step(-1)" aria-label="Decrease">−</button>
                <label class="qty-amount">
                  <input type="number" inputmode="decimal" step="any" min="0"
                         x-model.number="sheet.amount">
                  <small x-text="sheetUnitLabel"></small>
                </label>
                <button class="qty-step" @click="step(1)" aria-label="Increase">+</button>
              </div>

              <!-- The slider is the fast way and the box is the exact one; both
                   write the same number. Fixed range per unit, so the travel
                   means the same thing on every food. -->
              <input class="qty-slider" type="range" min="0"
                     :max="sheetMax()" :step="sheetStep()" x-model.number="sheet.amount"
                     :aria-label="`Amount in ${sheetUnitLabel}`">

              <p class="prefill" x-show="sheet.prefilled">↺ Your usual amount</p>
              <p class="prefill" x-show="sheetStoredLabel" x-text="sheetStoredLabel"></p>

              <div class="macros">
                <template x-for="m in [
                  { key: 'protein_g', name: 'Protein', color: 'var(--color-protein)' },
                  { key: 'carbs_g',   name: 'Carbs',   color: 'var(--color-carbs)' },
                  { key: 'fat_g',     name: 'Fat',     color: 'var(--color-fat)' }
                ]" :key="m.key">
                  <div class="macro">
                    <span class="dot" :style="`background: ${m.color}`"></span>
                    <span class="macro-name" x-text="m.name"></span>
                    <span class="macro-val" style="margin-left: auto;"
                          x-text="sheetMacros[m.key] ?? '—'"></span>
                  </div>
                </template>
              </div>


              <button class="btn btn-primary btn-block" @click="confirmSheet()">
                Log <span x-text="Math.round(sheetMacros.calories ?? 0)"></span> kcal
              </button>
              <button class="btn btn-ghost btn-block" @click="closeSheet()">Cancel</button>

              <!-- A nutrition label for the amount chosen, not for one serving:
                   it reads the same scaled macros the Save button does. -->

              <div class="nutrition" x-show="sheetLabel.hasAny" x-cloak>
                <div class="nf-title">Nutrition Facts</div>
                <div class="nf-serving">
                  <span>Serving size</span><span x-text="sheetServingLabel"></span>
                </div>
                <!-- What the box calls one serving, when it calls it anything. -->
                <div class="nf-serving nf-serving-text" x-show="sheetServingText" x-cloak>
                  <span>One serving is</span><span x-text="sheetServingText"></span>
                </div>

                <div class="nf-calories">
                  <span>Calories</span><b x-text="sheetLabel.calories ?? '—'"></b>
                </div>

                <div class="nf-dv">% Daily Value*</div>

                <template x-for="r in sheetLabel.printedRows" :key="r.key">
                  <div class="nf-row" :class="[`nf-in-${r.indent}`, r.bold && 'is-major']">
                    <span class="nf-name">
                      <span x-text="r.name"></span>
                      <span class="nf-amount" x-text="r.amount ?? '—'"></span>
                    </span>
                    <span class="nf-pct" x-text="r.percent === null ? '' : `${r.percent}%`"></span>
                  </div>
                </template>

                <div class="nf-rule" x-show="sheetLabel.printedMicros.length"></div>

                <template x-for="r in sheetLabel.printedMicros" :key="r.key">
                  <div class="nf-row">
                    <span class="nf-name">
                      <span x-text="r.name"></span>
                      <span class="nf-amount" x-text="r.amount ?? '—'"></span>
                    </span>
                    <span class="nf-pct" x-text="r.percent === null ? '' : `${r.percent}%`"></span>
                  </div>
                </template>

                <p class="nf-note">
                  * Percent Daily Values are based on a 2,000 calorie diet. Only
                  the figures the source published are listed.
                </p>
              </div>
            </div>
          </div>
        </template>

        <!-- New food ------------------------------------------------------- -->
        <template x-if="creating">
          <div class="sheet-backdrop" @click.self="cancelCreate()">
            <div class="sheet" x-init="$swipe($el, () =&gt; { cancelCreate() })">
              <div class="grabber"></div>
              <div class="card-label">
                New food ·
                <span x-text="draftBasis"></span>
              </div>
              <p class="servingraw" x-show="draft.servingRaw" x-text="draft.servingRaw"></p>

              <div class="field">
                <label for="f-name">Name</label>
                <input id="f-name" type="text" x-model="draft.name" autocomplete="off">
              </div>

              <div class="field">
                <label for="f-brand">Brand</label>
                <input id="f-brand" type="text" x-model="draft.brand" autocomplete="off">
              </div>

              <!-- This pair is the basis: the quantity the macros below are
                   measured against, which is a serving only when the unit
                   happens to be one. It was labelled "Amount", which reads as
                   "how much am I eating" — the one thing it does not mean. The
                   label is a sentence now, so the two boxes finish it. -->
              <div class="field basis-field">
                <label for="f-qty">The numbers below are for</label>
                <div class="basis-row">
                  <input id="f-qty" type="number" inputmode="decimal" step="any"
                         x-model.number="draft.serving_qty" aria-label="Basis amount">
                  <input id="f-unit" type="text" x-model="draft.serving_unit"
                         aria-label="Basis unit">
                  <span>of this food</span>
                </div>
              </div>

              <!-- Only when OFF gave no serving size. One number off the
                   label converts the whole draft. The line that used to restate
                   the basis here is gone: the field above now says it once. -->
              <template x-if="draft.serving_unit !== 'serving'">
                <div class="notice">
                  Eating it by the <span x-text="draft.serving_unit"></span> is rarely how it works.
                  Put the real serving off the label here and every number above follows.
                  <div class="serving-fix">
                    <label class="field">
                      <span>One serving is</span>
                      <input type="number" inputmode="decimal" step="any" min="0"
                             x-model="servingSize" :placeholder="draft.serving_unit">
                    </label>
                    <button class="btn" @click="applyServingSize()" :disabled="!(Number(servingSize) > 0)">Use it</button>
                  </div>
                </div>
              </template>

              <div class="field-grid">
                <div class="field">
                  <label for="f-kcal">Calories</label>
                  <input id="f-kcal" type="number" inputmode="decimal" step="any" x-model="draft.calories">
                </div>
                <div class="field">
                  <label for="f-protein">Protein g</label>
                  <input id="f-protein" type="number" inputmode="decimal" step="any" x-model="draft.protein_g">
                </div>
                <div class="field">
                  <label for="f-carbs">Carbs g</label>
                  <input id="f-carbs" type="number" inputmode="decimal" step="any" x-model="draft.carbs_g">
                </div>
                <div class="field">
                  <label for="f-fat">Fat g</label>
                  <input id="f-fat" type="number" inputmode="decimal" step="any" x-model="draft.fat_g">
                </div>
                <div class="field">
                  <label for="f-fiber">Fiber g</label>
                  <input id="f-fiber" type="number" inputmode="decimal" step="any" x-model="draft.fiber_g">
                </div>
                <div class="field">
                  <label for="f-sodium">Sodium mg</label>
                  <input id="f-sodium" type="number" inputmode="decimal" step="any" x-model="draft.sodium_mg">
                </div>
              </div>

              <button class="btn btn-primary btn-block" :disabled="!canSaveDraft" @click="addDraft()">
                Next
              </button>
              <button class="btn btn-ghost btn-block" @click="cancelCreate()">Cancel</button>
            </div>
          </div>
        </template>
      </main>

      <!-- Train / Stats ---------------------------------------------------- -->
      <template x-if="$store.ui.view === 'train'">
      <main class="app-main" x-data="trainPage">

        <!-- Folded away. First thing on the tab, and the whole bar reopens it. -->
        <template x-if="session && collapsed">
          <button class="running-bar" @click="collapsed = false">
            <span class="running-caret" aria-hidden="true">›</span>
            <span class="running-name" x-text="session.name || 'Workout'"></span>
            <span class="running-meta">
              <span x-text="elapsed"></span> ·
              <span x-text="`${volume.toLocaleString()} lb`"></span>
            </span>
            <span class="running-open">Open</span>
          </button>
        </template>

        <!-- Nothing running, or running but folded away ---------------------- -->
        <template x-if="!session || collapsed">
          <div style="display: contents;">
            <div class="section-head">
              <span>Train</span>
              <button class="chip" @click="menu = true" aria-label="More options">⋯</button>
            </div>

            <button class="btn btn-primary btn-block" @click="startEmpty()">Start workout</button>

            <div class="stack">
              <div class="section-head">
                <span>Routines</span>
                <div class="chips">
                  <!-- `|| reordering` so the way out is never the thing that
                       disappears. -->
                  <button class="chip" x-show="routines.length > 1 || reordering"
                          @click="toggleReorder()"
                          x-text="reordering ? 'Done' : 'Reorder'"></button>
                  <button class="chip" x-show="!reordering" @click="newRoutine()">New</button>
                </div>
              </div>

              <!-- Reordering: one column at any width, so the drag's single
                   vertical stride is always the right measurement. -->
              <!-- Reordering: one column at any width, so the drag's single
                   vertical stride is always the right measurement. The category
                   headers are rows in the same list rather than wrappers around
                   it — that is what lets one drag say both "third" and "and now
                   it is a Lower routine". They are the same height as the cards
                   for the same reason: the stride is measured once. -->
              <div class="cardstack" x-show="reordering" x-ref="routinestack">
                <template x-for="(row, i) in reorderRows"
                          :key="row.kind === 'header' ? `h${row.category}` : row.routine.id">
                  <div class="card row-card"
                       :class="row.kind === 'header' && 'is-group'"
                       data-card
                       :data-key="row.kind === 'header' ? '' : row.routine.id">
                    <template x-if="row.kind === 'header'">
                      <div class="row-text">
                        <small x-text="row.category ?? 'Uncategorised'"></small>
                      </div>
                    </template>
                    <template x-if="row.kind === 'routine'">
                      <div class="row-drag">
                        <span class="grip" aria-hidden="true"
                              x-init="$dragCard($el,
                                        () => [...$refs.routinestack.querySelectorAll('[data-card]')],
                                        (to, key) => reorderRoutineTo(key, to))">⠿</span>
                        <div class="row-text"><b x-text="row.routine.name"></b></div>
                      </div>
                    </template>
                  </div>
                </template>
              </div>

              <p class="empty" x-show="reordering && reorderRows.some(r => r.kind === 'header')"
                 style="padding:var(--space-2) 0; text-align:left" x-cloak>
                Drag a routine under a heading to move it there.
              </p>

              <!-- One block per category, each foldable. A single uncategorised
                   group gets no heading at all: there is nothing to fold it away
                   from, and a lone "Uncategorised" bar is just noise. -->
              <template x-for="g in routineGroups" :key="g.category ?? '\u0000none'">
                <div class="routine-group" x-show="!reordering">
                  <button class="group-head" x-show="g.category || routineGroups.length > 1"
                          @click="toggleCategory(g.category)"
                          :aria-expanded="!isFolded(g.category)">
                    <span class="group-caret" :class="{ 'is-shut': isFolded(g.category) }"
                          aria-hidden="true">
                      <svg viewBox="0 0 12 12" fill="none">
                        <path d="M4.5 2.5L8 6l-3.5 3.5" stroke="currentColor"
                              stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </span>
                    <b x-text="g.category ?? 'Uncategorised'"></b>
                    <small x-text="$store.ui.count(g.routines.length, 'routine')"></small>
                  </button>

                  <div class="routine-grid" x-show="!isFolded(g.category)" x-cloak>
                    <template x-for="r in g.routines" :key="r.id">
                      <button class="routine-card" @click="openRoutine(r)" x-data="{ c: routineCard(r) }">
                        <div class="routine-top">
                          <div style="min-width:0">
                            <div class="routine-name" x-text="r.name"></div>
                            <div class="routine-meta">
                              <span x-text="`${c.exercises} exercises`"></span>
                              <span x-show="c.lastLabel"> · <span x-text="c.lastLabel"></span></span>
                            </div>
                          </div>
                          <span class="tap">›</span>
                        </div>

                        <!-- What the routine works, as a share of its exercises. -->
                        <div class="coverage" x-show="c.bars.length">
                          <template x-for="b in c.bars" :key="b.family">
                            <i :style="`background:${b.colour}; width:${b.width}%`"></i>
                          </template>
                          <span x-text="c.label"></span>
                        </div>

                        <div class="routine-stats" x-show="c.count">
                          <span><b x-text="c.count"></b> done</span>
                          <span x-show="c.volumeLabel"><b x-text="c.volumeLabel"></b> avg</span>
                          <span x-show="c.avgMinutes"><b x-text="c.avgMinutes"></b> min</span>
                        </div>
                      </button>
                    </template>
                  </div>
                </div>
              </template>

              <p class="empty" x-show="!routines.length">
                No routines yet. Start a workout and save it as one at the end.
              </p>
            </div>

            <!-- Past sessions ------------------------------------------------ -->
            <div class="stack">
              <div class="section-head"><span>History</span></div>

              <!-- Only worth a switch when there is somebody else to switch to. -->
              <div class="chips" x-show="trainingPeople.length > 1"
                   style="margin-bottom: var(--space-3)">
                <template x-for="p in trainingPeople" :key="p.email">
                  <button class="chip" :class="viewingOwner === p.email && 'is-active'"
                          @click="historyOwner = p.email" x-text="p.name"></button>
                </template>
              </div>

              <div class="rows">
                <template x-for="s in history" :key="s.id">
                  <button class="row" @click="openSession(s)">
                    <div class="row-text">
                      <b x-text="s.name || 'Workout'"></b>
                      <small x-text="`${sessionDate(s)} · ${sessionSummary(s)}`"></small>
                    </div>
                    <span class="tap">›</span>
                  </button>
                </template>
              </div>

              <p class="empty" x-show="!history.length"
                 x-text="viewingSelf ? 'No finished workouts yet.'
                   : 'Nothing logged here yet.'"></p>
            </div>
          </div>
        </template>

        <!-- One past session, read back ------------------------------------- -->
        <template x-if="past">
          <div class="sheet-backdrop" @click.self="closeSession()">
            <div class="sheet" x-init="$swipe($el, () =&gt; { closeSession() })">
              <div class="grabber"></div>
              <div class="sheet-head">
                <h2 x-text="past.name || 'Workout'"></h2>
                <button class="tap" @click="closeSession()" aria-label="Close">×</button>
              </div>

              <div class="chips">
                <span class="chip" x-show="!pastIsMine" x-text="pastOwnerName"></span>
                <span class="chip" x-text="sessionDate(past)"></span>
                <span class="chip" x-show="sessionLength(past)" x-text="sessionLength(past)"></span>
                <span class="chip" x-text="sessionSummary(past)"></span>
              </div>

              <!-- Tappable only on your own workout. The exercise-history sheet
                   is built from your sessions, so offering it here would answer
                   a question nobody asked with somebody else's numbers. -->
              <div class="rows">
                <template x-for="group in pastGroups" :key="group.key">
                  <div class="row">
                    <span class="thumb" x-html="muscleMap(group.exerciseId, group.name)"></span>
                    <template x-if="pastIsMine">
                      <button class="row-text" @click="openExercise(group.exerciseId, group.name)">
                        <b x-text="group.name"></b>
                        <small x-text="groupLine(group)"></small>
                      </button>
                    </template>
                    <template x-if="!pastIsMine">
                      <div class="row-text">
                        <b x-text="group.name"></b>
                        <small x-text="groupLine(group)"></small>
                      </div>
                    </template>
                    <span class="tap" x-show="pastIsMine">›</span>
                  </div>
                </template>
              </div>

              <p class="empty" x-show="!pastGroups.length">Nothing was logged in this one.</p>
              <button class="btn btn-ghost btn-block" @click="closeSession()">Close</button>
            </div>
          </div>
        </template>

        <!-- Workout in progress --------------------------------------------- -->
        <template x-if="session && !collapsed">
          <div style="display: contents;">

            <div class="workout-head">
              <!-- An SVG chevron, not `⌄` (U+2304): that glyph's ink is 7px tall
                   and sits 5px below the centre of a 40px button, measured. A
                   path in a viewBox is centred by construction: 9 -> 15 puts the
                   stroke's midpoint on 12, which is the viewBox centre. -->
              <button class="tap" @click="collapsed = true" aria-label="Hide workout">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <span class="workout-title" x-text="session.name || 'Workout'"></span>
            </div>

            <div class="timer">
              <div>
                <div class="t" x-text="elapsed"></div>
                <small>Elapsed</small>
              </div>

              <!-- Inside the bar, not under it: a row that appeared on its own
                   pushed every exercise card down at the exact moment you were
                   reading them. -->
              <div class="rest-controls" x-show="restEndsAt">
                <button class="chip" @click="addRest(-30)"
                        aria-label="Thirty seconds less rest">−30</button>
                <button class="chip" @click="addRest(30)"
                        aria-label="Thirty seconds more rest">+30</button>
                <button class="chip" @click="endRest()" aria-label="Skip rest">Skip</button>
              </div>

              <div class="rest" x-show="restEndsAt">
                <b x-text="restClock"></b>
                <small>Rest</small>
              </div>
              <div class="rest" x-show="!restEndsAt">
                <b class="num" x-text="volume.toLocaleString()"></b>
                <small>lb volume</small>
              </div>
            </div>

            <!-- data-card: what $dragCard measures and moves. -->
            <div class="cardstack" x-ref="cardstack">
            <template x-for="group in groups" :key="group.key">
              <div class="card" data-card :data-key="group.key"
                   :class="isCardioGroup(group) && 'is-cardio'">
                <div class="readout-head">
                  <div style="display:flex; align-items:center; gap:var(--space-3); min-width:0;">
                    <span class="grip" aria-hidden="true"
                          x-init="$dragCard($el,
                                    () => [...$refs.cardstack.querySelectorAll('[data-card]')],
                                    (to, key) => reorderTo(key, to))">⠿</span>
                    <span class="thumb" x-html="muscleMap(group.exerciseId, group.name)"></span>
                    <button style="min-width:0; text-align:left"
                            @click="openExercise(group.exerciseId, group.name)">
                      <b x-text="group.name"></b>
                      <div class="prev" x-show="previous(group)">
                        Last: <span x-text="previous(group)"></span> · tap for history
                      </div>
                    </button>
                  </div>
                  <button class="chip" @click="openExMenu(group)"
                          :aria-label="`Options for ${group.name}`">⋯</button>
                </div>

                <div class="setgrid">
                  <div class="sethead">
                    <span>#</span><span>Prev</span>
                    <span x-text="isCardioGroup(group) ? 'mi' : 'lb'"></span>
                    <span x-text="isCardioGroup(group) ? 'min' : 'Reps'"></span>
                    <span></span><span></span>
                  </div>
                  <template x-for="(set, i) in group.sets" :key="set.id">
                    <div class="row-swipe" x-init="$swipeRow($el)">
                      <button class="row-remove" @click="dropSet(set)"
                              :aria-label="`Remove set ${i + 1}`">Remove</button>
                      <!-- Object form, not an array. The array form left a literal
                           `false` in the class list and, measured in the browser,
                           did not reliably re-apply `done` when completed_at was
                           set — the value bindings on the same row updated while
                           the class did not, which is the tick appearing to lag
                           behind the numbers. -->
                      <div class="setrow" :class="{ done: !!currentSet(set).completed_at,
                                        record: isRecord(currentSet(set), group) }">
                        <span class="idx" :class="{ warm: set.is_warmup }" x-text="set.is_warmup ? 'W' : i + 1"></span>
                        <!-- What this set was last time, so you can see the whole
                             progression without opening the history sheet. -->
                        <span class="prev-cell"
                              x-text="isCardioGroup(group)
                                ? cardioLine(placeholderFor(group, i) || {})
                                : previousLabel(group, i)"></span>
                        <!-- value, not placeholder, once you have typed something:
                             an empty box with a grey suggestion is a box you can
                             tap and type into without clearing anything first. -->
                        <template x-if="!isCardioGroup(group)">
                          <input class="cell num" type="number" inputmode="decimal" step="any"
                                 :value="currentSet(set).weight_lb ?? ''"
                                 :placeholder="placeholderWeight(group, i)"
                                 @change="edit(set, 'weight_lb', $event.target.value)"
                                 aria-label="Weight in pounds">
                        </template>
                        <template x-if="!isCardioGroup(group)">
                          <input class="cell num" type="number" inputmode="numeric"
                                 :value="currentSet(set).reps ?? ''"
                                 :placeholder="placeholderReps(group, i)"
                                 @change="edit(set, 'reps', $event.target.value)"
                                 aria-label="Reps">
                        </template>
                        <!-- Typed in km and minutes because that is how people say
                             it; stored as metres and seconds so pace is a plain
                             division and no stored distance is ambiguous. -->
                        <template x-if="isCardioGroup(group)">
                          <input class="cell num" type="number" inputmode="decimal" step="any"
                                 :value="cardioValue(set, 'mi')"
                                 @change="editCardio(set, 'mi', $event.target.value)"
                                 aria-label="Distance in miles">
                        </template>
                        <template x-if="isCardioGroup(group)">
                          <input class="cell num" type="number" inputmode="decimal" step="any"
                                 :value="cardioValue(set, 'min')"
                                 @change="editCardio(set, 'min', $event.target.value)"
                                 aria-label="Duration in minutes">
                        </template>
                        <!-- What to hang on the bar for THIS set, on its own row.
                             Stacked underneath, three of these read as a separate
                             list and you had to count down it to find your set. -->
                        <div class="loadout" :aria-label="loadLabel(group, set)">
                          <template x-for="(p, i) in plateGroups(group, set)" :key="i">
                            <b :style="`background: ${plateColour(p.size)}`"
                               x-text="p.count > 1 ? `${p.size}×${p.count}` : p.size"></b>
                          </template>
                        </div>
                        <button class="check" @click="toggleDone(set, placeholderFor(group, i))"
                                :aria-label="currentSet(set).completed_at ? 'Mark set incomplete' : 'Mark set done'"
                        >✓</button>
                      </div>
                    </div>
                  </template>
                </div>

                <button class="btn btn-ghost btn-block" @click="addSetTo(group)">Add set</button>
              </div>
            </template>
            </div>

            <button class="btn btn-block" @click="openPicker()">Add exercise</button>
            <button class="btn btn-primary btn-block" @click="finishing = true">Finish workout</button>
          </div>
        </template>

        <!-- Exercise card menu ---------------------------------------------- -->
        <template x-if="exMenu">
          <div class="sheet-backdrop" @click.self="closeExMenu()">
            <div class="sheet" x-init="$swipe($el, () =&gt; { closeExMenu() })">
              <div class="grabber"></div>
              <div class="card-label" x-text="exMenu.name"></div>

              <button class="btn btn-block" @click="replaceFromMenu()">Replace exercise</button>
              <button class="btn btn-block" @click="addWarmupFromMenu()">Add warm-up set</button>
              <button class="btn btn-block" @click="duplicateFromMenu()">Duplicate exercise</button>

              <div class="btn-row">
                <button class="btn" @click="nudgeExercise(-1)"
                        :disabled="exMenuIndex &lt;= 0">↑ Move up</button>
                <button class="btn" @click="nudgeExercise(1)"
                        :disabled="exMenuIndex === groups.length - 1">↓ Move down</button>
              </div>
              <p class="prefill">Or drag a card by its ⠿ handle.</p>

              <button class="btn btn-danger btn-block" @click="removeFromMenu()">Remove exercise</button>
              <button class="btn btn-ghost btn-block" @click="closeExMenu()">Cancel</button>
            </div>
          </div>
        </template>

        <!-- Exercise picker -------------------------------------------------- -->
        <!-- is-nested: this also opens from inside the routine builder, which
             sits later in the document and would otherwise paint over it. -->
        <!-- is-search: the field and Cancel stay put while the list scrolls —
             see the rule in pages.css. The keyboard is handled for every sheet
             by trackKeyboardInset() in app.js, not by this one specially. -->
        <template x-if="picker">
          <div class="sheet-backdrop is-nested is-search" @click.self="closePicker()">
            <div class="sheet" x-init="$swipe($el, () =&gt; { closePicker() })">
              <div class="grabber"></div>
              <div class="card-label" x-show="replacing"
                   x-text="replacing && `Replace ${replacing.name} with…`"></div>
              <div class="search">
                <span aria-hidden="true">⌕</span>
                <input type="search" placeholder="Search exercises…" x-model="pickerTerm" autocomplete="off">
              </div>
              <div class="rows">
                <template x-for="e in library.slice(0, 40)" :key="e.id">
                  <button class="row"
                          @click="builder ? addToRoutine(e) : (replacing ? applyReplace(e) : addExercise(e))">
                    <!-- loading="lazy": nothing downloads until it scrolls in -->
                    <span class="thumb" x-html="muscleMap(e.id, e.name)"></span>
                    <div class="row-text">
                      <b x-text="e.name"></b>
                      <small x-text="[e.primary_muscle, e.equipment].filter(Boolean).join(' · ')"></small>
                    </div>
                    <span class="tap">›</span>
                  </button>
                </template>
              </div>
              <p class="empty" x-show="!library.length">Nothing matches that.</p>
              <button class="btn btn-ghost btn-block" @click="closePicker()">Cancel</button>
            </div>
          </div>
        </template>

        <!-- Overflow menu ----------------------------------------------------- -->
        <template x-if="menu">
          <div class="sheet-backdrop" @click.self="menu = false">
            <div class="sheet" x-init="$swipe($el, () =&gt; { menu = false })">
              <div class="grabber"></div>
              <div class="card-label">Options</div>

              <button class="btn btn-block"
                      @click="menu = false; $store.ui.openSettings()">
                Notification settings
              </button>

              <label class="btn btn-block" style="cursor:pointer">
                Import from Hevy (CSV)
                <input type="file" accept=".csv,text/csv" @change="importFile($event)" hidden>
              </label>

              <div class="sync-line" x-show="hevy && hevy.phase !== 'done' && hevy.phase !== 'error'">
                <span class="spinner" style="width:14px;height:14px"></span>
                <span x-text="hevyLabel"></span>
              </div>
              <div class="notice" x-show="hevy && hevy.phase === 'done'" x-text="hevyLabel"></div>
              <div class="notice notice-error" x-show="hevy && hevy.phase === 'error'"
                   x-text="hevy && hevy.message"></div>

              <button class="btn btn-ghost btn-block" @click="menu = false">Close</button>
            </div>
          </div>
        </template>

        <!-- Exercise history -------------------------------------------------- -->
        <template x-if="detail">
          <div class="sheet-backdrop is-nested" @click.self="closeExercise()">
            <div class="sheet" x-init="$swipe($el, () =&gt; { closeExercise() })">
              <div class="grabber"></div>
              <div class="sheet-head">
                <h2 x-text="detail.name"></h2>
                <button class="tap" @click="closeExercise()" aria-label="Close">×</button>
              </div>

              <div class="detail-top">
                <div class="figure-pair" x-html="muscleMapPair(detail.exerciseId, detail.name)"></div>

                <div class="how" x-data="{ open: false }">
                  <div class="card-label" x-show="detail.exercise.primary_muscle"
                       x-text="detail.exercise.primary_muscle"></div>

                  <button class="btn btn-block" @click="open = !open"
                          x-show="detailInstructions.length" :aria-expanded="open">
                    <span x-text="open ? 'Hide how-to' : 'How to do it'"></span>
                    <span x-text="open ? '▴' : '▾'"></span>
